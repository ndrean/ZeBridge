  # consumer:
  #   build:
  #     context: ./consumer
  #     dockerfile: Dockerfile
  #   container_name: consumer
  #   depends_on:
  #     nats-init:
  #       condition: service_completed_successfully
  #     bridge:
  #       condition: service_started
  #     postgres-replica:
  #       condition: service_healthy
  #   env_file:
  #     - .env.prod
  #   environment:
  #     NATS_HOST: nats-server
  #     NATS_PORT: "4222"
  #     NATS_USER: ${NATS_BRIDGE_USER}
  #     NATS_PASSWORD: ${NATS_BRIDGE_PASSWORD}
  #     TABLES: ${BRIDGE_CDC_TABLES}
  #     FORMAT: msgpack
  #     PG_HOST: postgres-replica
  #     PG_PORT: 5432
  #     PG_USER: ${PG_USER}
  #     PG_PASSWORD: ${PG_PASSWORD}
  #     PG_DB: ${PG_DB}
  #   networks:
  #     - cdc-net
  #   restart: unless-stopped

volumes:
  postgres-primary-data:
    driver: local

  nats-data:
    driver: local
  nats-config:
    driver: local

networks:
  cdc-net:
    driver: bridge
