services:
  # 1. Primary PostgreSQL (Source DB with Logical Replication)
  postgres-primary:
    image: postgres:18
    container_name: postgres-primary
    # The server's own superuser bootstrap — admin territory, same as bridge-init.
    env_file:
      - .env.docker
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_DB: postgres
    ports:
      # Override PG_PUBLISH_PORT when a Postgres already listens on the host's 5432 —
      # a loopback-bound host server shadows Docker's wildcard bind for localhost.
      - "${PG_PUBLISH_PORT:-55432}:5432"
    volumes:
      # postgres:18+ wants the mount at /var/lib/postgresql, not .../data — it stores
      # data in a version-specific subdirectory so pg_upgrade --link can work.
      - postgres-primary-data:/var/lib/postgresql
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_slot_wal_keep_size=10GB"
      - "-c"
      - "wal_sender_timeout=300s"
      - "-c"
      - "logical_decoding_work_mem=256MB"
      - "-c"
      - "wal_buffers=64MB"
      - "-c"
      - "commit_delay=1000"
      - "-c"
      - "commit_siblings=5"
      # - "-c" 
      # - "fsync=off" # <-- local testing+ speed
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - cdc-net

  # 3. NATS Configuration Generator
  nats-config-gen:
    image: busybox:latest
    container_name: nats-config-gen
    # .env.admin: NATS_BRIDGE_NKEY_PUB is the key the *server* is told to trust, which
    # is an authorization decision and not one of the bridge's own credentials.
    env_file:
      - .env.docker
    volumes:
      - nats-config:/config
      - ./nats-server.conf.template:/nats-server.conf.template:ro
    command:
      - sh
      - -c
      - |
        # Fail loudly rather than substituting an empty string. `password: ""` is a
        # valid config that the server accepts, so an unset variable would silently
        # publish an account anyone can log into as `alice` with no password.
        # OPEN_TENANT is not a credential but fails the same way: empty renders `cdc..>`,
        # an illegal subject the server refuses at startup — with every login failing
        # for a reason that reads like a credential problem.
        for v in NATS_BRIDGE_NKEY_PUB NATS_ALICE_PASSWORD NATS_BOB_PASSWORD NATS_JOHN_PASSWORD NATS_MARY_PASSWORD NATS_NINA_PASSWORD OPEN_TENANT; do
          eval "val=\$$$$v"
          if [ -z "$$val" ]; then
            echo "✗ $$v is unset — refusing to generate a config with an empty value" >&2
            exit 1
          fi
        done
        # '|' as the delimiter, not '/': a bcrypted password (`nats server passwd`)
        # is base64 over ./A-Za-z0-9 and contains slashes, which would end the sed
        # expression early and emit a corrupt config.
        sed -e "s|\$${NATS_BRIDGE_NKEY_PUB}|$${NATS_BRIDGE_NKEY_PUB}|g" \
            -e "s|\$${NATS_ALICE_PASSWORD}|$${NATS_ALICE_PASSWORD}|g" \
            -e "s|\$${NATS_BOB_PASSWORD}|$${NATS_BOB_PASSWORD}|g" \
            -e "s|\$${NATS_JOHN_PASSWORD}|$${NATS_JOHN_PASSWORD}|g" \
            -e "s|\$${NATS_MARY_PASSWORD}|$${NATS_MARY_PASSWORD}|g" \
            -e "s|\$${NATS_NINA_PASSWORD}|$${NATS_NINA_PASSWORD}|g" \
            -e "s|\$${OPEN_TENANT}|$${OPEN_TENANT}|g" \
            /nats-server.conf.template > /config/nats-server.conf
        # ⚠️ Every $${...} must be gone. An unsubstituted one is not a config error — NATS
        # accepts it as a literal password, so the account exists with a password nobody
        # can type and every login fails with `Authorization Violation`, which reads like
        # a wrong credential rather than a broken render. This is what adding `bob` to the
        # template without adding it here produced.
        if grep -q '\$${' /config/nats-server.conf; then
          echo "✗ unsubstituted variable left in the config:" >&2
          grep -n '\$${' /config/nats-server.conf >&2
          exit 1
        fi
        echo "✓ Generated NATS config with credentials"
    networks:
      - cdc-net
    restart: "no"

  # 4. NATS JetStream Server
  nats-server:
    image: nats:latest
    container_name: nats-server
    depends_on:
      nats-config-gen:
        condition: service_completed_successfully
    ports:
      # ⚠️ Parameterized like PG_PUBLISH_PORT above, and for the same reason: a
      # native stack on the host already holds 4222/8222/8080, and a hardcoded
      # publish makes `docker compose up` fail to bind rather than run beside it.
      # The values inside the network never change (containers talk on 4222).
      - "${NATS_PUBLISH_PORT:-4222}:4222" # Client TCP connections
      - "${NATS_MONITOR_PUBLISH_PORT:-8222}:8222" # HTTP monitoring
      - "${NATS_WS_PUBLISH_PORT:-8080}:8080" # WebSocket connections
    volumes:
      - nats-data:/data
      - nats-config:/config:ro
    command: [ "-js", "-m", "8222", "-c", "/config/nats-server.conf" ]
    # No healthcheck: the nats image is distroless (no sh, no wget), so CMD-SHELL
    # probes can never pass. nats-init below polls for readiness itself.
    restart: unless-stopped
    networks:
      - cdc-net

  # 4b. Drift check — advisory, and deliberately nothing depends on it
  #
  # ⚠️ **Nothing may `depends_on` this service.** It exits non-zero on drift so the verdict
  # travels (visible as `exited (1)` in `docker compose ps`, and adoptable by CI later), but
  # blocking a deploy on it would be wrong today: the declaration is often legitimately ahead
  # of reality — add a table, migrate, set TENANT_RULES, reload NATS — and findings inside
  # that window are correct without being bugs. Promote individual checks to gating by adding
  # a `depends_on` here, not by editing the script.
  #
  #     docker compose -f docker-compose.full.yml --env-file .env.admin run --rm zb-check
  zb-check:
    image: python:3.12-slim
    container_name: zb-check
    profiles: [ "check" ] # never starts with a plain `up`; ask for it by name
    depends_on:
      postgres-primary:
        condition: service_healthy
    env_file:
      - .env.docker
      - .env.bridge
    environment:
      # zb.py shells out to psql. Inside a container there is no docker socket, so it
      # connects over the network instead of `docker exec`.
      - ZB_PSQL=psql -h postgres-primary -p 5432 -U ${PG_USER} -d ${PG_DB}
      - PGPASSWORD=${PG_PASSWORD}
      - NATS_URL=nats://nats-server:4222
      - NATS_BRIDGE_NKEY_SEED=${NATS_BRIDGE_NKEY_SEED}
      # The LIVE rendered conf, mounted read-only — not the template. Their disagreement is
      # itself a finding.
      - ZB_NATS_CONF=/config/nats-server.conf
    volumes:
      - ./scripts:/scripts:ro
      - ./grammar.json:/grammar.json:ro
      - nats-config:/config:ro
    working_dir: /scripts/scenarios
    command:
      - sh
      - -c
      - |
        set -e
        apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null
        pip install --quiet --no-cache-dir -r requirements.txt
        python check.py
    networks:
      - cdc-net
    restart: "no"

  # 5. NATS Stream & KV Bucket Initializer
  nats-init:
    image: natsio/nats-box:latest
    container_name: nats-init
    networks:
      - cdc-net
    depends_on:
      nats-server:
        condition: service_started
    env_file:
      - .env.docker
    # From the shell, not from a file — a private key belongs in neither env file.
    # ⚠️ Unset means a blank seed: the server answers `Authorization Violation`, and the
    # `until nats server check connection` loop below spins forever without ever
    # creating a stream. Run compose as:
    #   NATS_BRIDGE_NKEY_SEED="SU..." docker compose ... up -d
    environment:
      - NATS_BRIDGE_NKEY_SEED=${NATS_BRIDGE_NKEY_SEED}
    command:
      - sh
      - -c
      - |
        set -e
        export NATS_URL=nats-server:4222

        # Fail here, not in the wait loop below. The server is configured with an nkey,
        # so an unset seed means every command answers `Authorization Violation` — and
        # `nats server check connection` reports that as "not up yet", so the loop spun
        # forever and `up -d` looked like it had merely been slow. An empty seed is a
        # missing argument, not a transient condition.
        if [ -z "$${NATS_BRIDGE_NKEY_SEED}" ]; then
          echo '✗ NATS_BRIDGE_NKEY_SEED is empty.' >&2
          echo '  The server requires an nkey, and this container creates the streams,' >&2
          echo '  so it needs the seed. It is deliberately in no env file — pass it in:' >&2
          echo '    NATS_BRIDGE_NKEY_SEED="SU..." docker compose -f docker-compose.full.yml \' >&2
          echo '      --env-file .env.admin up -d' >&2
          exit 1
        fi

        echo $${NATS_BRIDGE_NKEY_SEED} > /tmp/seed.txt
        export NATS_NKEY=/tmp/seed.txt

        # Bounded: a wait that cannot end is indistinguishable from a hang. 60s is far
        # more than nats-server needs, and reaching it means something is wrong that
        # waiting will not fix — a rejected key, or a server that never came up.
        echo 'Waiting for NATS server...'
        waited=0
        until nats server check connection 2>/dev/null; do
          waited=$$((waited + 1))
          if [ $$waited -ge 60 ]; then
            echo '✗ NATS did not accept a connection within 60s.' >&2
            echo '  Last attempt said:' >&2
            nats server check connection >&2 || true
            echo '  An Authorization Violation here means the seed does not match the' >&2
            echo '  NATS_BRIDGE_NKEY_PUB in .env.admin that nats-config-gen wrote into' >&2
            echo '  nats-server.conf.' >&2
            exit 1
          fi
          sleep 1
        done

        # nats-box contains `jq`!

        # Stream NAMES as well as subjects: the bridge compiles both from this same
        # file (build.zig -> the "topology" module), so a rename here moves both ends
        # together. Hardcoding the names here is what let them drift before.
        echo 'Reading streams from grammar.json...'
        CDC_STREAM=$(jq -r '.streams.cdc' /grammar.json)
        MUTATIONS_STREAM=$(jq -r '.streams.mutations' /grammar.json)
        CDC_PREFIX=$(jq -r '.subjects.cdc_prefix' /grammar.json)
        MUTATIONS_PREFIX=$(jq -r '.subjects.mutations_prefix' /grammar.json)
        MUTATION_ERROR_PREFIX=$(jq -r '.subjects.mutation_error_prefix' /grammar.json)
        MUTATION_ACK_PREFIX=$(jq -r '.subjects.mutation_ack_prefix' /grammar.json)
        SCHEMA_KV=$(jq -r '.kv.schemas' /grammar.json)
        TENANTS_KV=$(jq -r '.kv.tenants' /grammar.json)
        GENERATIONS_KV=$(jq -r '.generations.kv' /grammar.json)

        # ── CDC is SPLIT PER TENANT, and that is a security boundary, not tidiness ──
        #
        # ⚠️ A subject permission governs core SUBSCRIBE and nothing else. A JetStream
        # consumer never subscribes to the subject it filters on — the server delivers to
        # the reader's own _INBOX and `filter_subject` is a stream-side selector the READER
        # chooses. So `cdc.acme.>` in a subscribe allow-list cannot stop a client creating a
        # consumer on a shared stream filtered at `cdc.globex.>`.
        #
        # Measured on one wide CDC stream: alice (tenant acme) was refused a core
        # subscription to `cdc.globex.>` and then pulled `cdc.globex.test_types.insert`
        # through a JetStream consumer, same credentials, same session.
        # `scripts/scenarios/crosstenant.py` is that test.
        #
        # The enforcement unit for JetStream reads is the STREAM. So one stream per tenant,
        # granted per stream (`$$JS.API.*.CDC_ACME`), and naming another tenant's stream is
        # refused by the broker rather than discouraged by convention.
        #
        # The bridge does not change: JetStream binds streams to subjects and the bridge
        # already publishes `cdc.<tenant>.<table>.<op>`. Each message lands in exactly one
        # stream — no duplication.

        # ── NO CDC stream is created here. Not one. ────────────────────────────
        #
        # CDC_PUBLIC, INIT_PUBLIC and the per-tenant CDC_<T> streams are created and
        # reconciled BY THE BRIDGE at boot, from zebridge_catalogue and
        # zebridge_user_tenants (f3be486). Tenants are no longer declared in
        # grammar.json at all — they are rows in a table now.
        #
        # ⚠️ This block used to branch on `jq '(.tenants // []) | length'` and, when it
        # came out 0, create the legacy WIDE stream on `cdc.>`. With tenants gone from
        # grammar.json it came out 0 every time — so nats-init created `cdc.>`, whose
        # subjects overlap every stream the bridge then tries to make, and the bridge
        # died at boot with `StreamSubjectOverlap`. Measured on the compose stack
        # 2026-08-28: the bridge container could not start at all.
        #
        # A legacy wide stream from an older deployment is REMOVED for the same reason.
        if nats stream info $$CDC_STREAM --json >/dev/null 2>&1; then
          echo "Removing legacy wide stream $$CDC_STREAM — its cdc.> overlaps every stream the bridge creates"
          nats stream rm $$CDC_STREAM -f || true
        fi

        # OPEN_TENANT is still validated here, because nothing else can: it is the token
        # `zebridge_guard_tenant()` writes when a tenant column arrives NULL or empty, so
        # rows carrying it publish to `cdc.<OPEN_TENANT>.<table>.<op>`. The bridge binds
        # that subject into CDC_PUBLIC at boot — but only if the value is a legal subject
        # token. Empty or malformed, those rows reach a subject NO stream captures: no
        # PubAck, retries exhaust, the bridge FATALs mid-WAL.
        if [ -z "$${OPEN_TENANT}" ]; then
          echo '✗ OPEN_TENANT is empty — the open tenant needs a subject in CDC_PUBLIC (set it in .env.docker)' >&2
          exit 1
        fi
        case "$${OPEN_TENANT}" in *.*|*' '*|*'*'*|*'>'*)
          echo "✗ OPEN_TENANT='$${OPEN_TENANT}' is not a legal NATS subject token" >&2; exit 1;;
        esac

        echo "Creating NATS JetStream stream: $$MUTATIONS_STREAM (subject: $$MUTATIONS_PREFIX.>)"
        # Dead letters share the stream but NOT the subject space: the ingress consumer
        # filters on "$$MUTATIONS_PREFIX.>", so a rejected mutation republished under that
        # prefix would be consumed by the bridge again — a poison pill with a feedback
        # loop. Hence a sibling prefix, captured here so failures are durable and a
        # client can read why its write was refused.
        # Verdicts (mutation_ack.<principal>.<msg_id>) share the stream for the same
        # reason dead letters do, and gain the property that makes them worth having: they
        # are durable for as long as the stream keeps them, so a client that was offline
        # when its write failed collects the verdict on reconnect. A NAK or a JetStream
        # advisory is ephemeral and would be gone.
        nats stream add $$MUTATIONS_STREAM --subjects="$$MUTATIONS_PREFIX.>,$$MUTATION_ERROR_PREFIX.>,$$MUTATION_ACK_PREFIX.>" --storage=file --retention=limits --max-age=7d --max-bytes=1G --replicas=1 --defaults \
          || nats stream edit $$MUTATIONS_STREAM --subjects="$$MUTATIONS_PREFIX.>,$$MUTATION_ERROR_PREFIX.>,$$MUTATION_ACK_PREFIX.>" -f \
          || true

        echo "Creating NATS KV bucket: $$SCHEMA_KV"
        nats kv add $$SCHEMA_KV --history=10 --replicas=1 || true

        # PROTOCOL.md "The Connection Flow" §Step 0: `$$KV.tenants.<principal>` → tenant,
        # so a client holding only a principal ID can learn its own tenant without
        # guessing or a build-time constant. --history=1: only the current mapping is
        # ever read.
        #
        # Not yet fed by a PG trigger on `zebridge_user_tenants` (NOTES.md §1.12 part 3)
        # — that lands with the rest of the Zig changes. Until then, seed it by hand to
        # exercise the NATS side alone, e.g.:
        #   nats kv put $$TENANTS_KV alice acme
        #   nats kv put $$TENANTS_KV bob   globex
        echo "Creating NATS KV bucket: $$TENANTS_KV"
        nats kv add $$TENANTS_KV --history=1 --replicas=1 || true

        # Chain manifests for the generation producer (NOTES.md §1.13); --history=1: only the
        # current manifest is ever read. Per-tenant OBJ_gen-<tenant> buckets are runtime-created.
        echo "Creating NATS KV bucket: $$GENERATIONS_KV"
        nats kv add $$GENERATIONS_KV --history=1 --replicas=1 || true

        echo 'NATS initialization complete!'
        exit 0
    restart: "no"
    volumes:
      - ./grammar.json:/grammar.json:ro

  # 6. Primary Postgres Initialization (Creates publication, users, test tables)
  bridge-init:
    image: postgres:18
    container_name: bridge-init
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - ./init.core.template.sql:/init.core.template.sql:ro
      - ./init.write.template.sql:/init.write.template.sql:ro
    # .env.docker: the compose stack's own self-contained file (see its header).
    # This is the one container that connects as the superuser.
    env_file:
      - .env.docker

    command:
      - /bin/bash
      - -c
      - |
        set -ex
        # Checked FIRST, for the same reason nats-init checks its seed before the
        # wait loop: this container's last act is to create the publication by name,
        # and there is no default for it. Finding that out after apt-get and two
        # template applies wastes the run and buries the message under psql output.
        : "$${BRIDGE_CDC_PUBLICATION:?is not set — .env.docker must name the publication, there is no default}"
        export PGPASSWORD="$${PG_PASSWORD}"
        # bring in `envsubst` via gettext-base
        apt-get update && apt-get install -y gettext-base
        # ZB_PROFILE=readonly installs the CDC/snapshot half only: no writer role, no
        # RLS, no tombstone guards. Anything else (and unset) installs both halves.
        #
        # The read-only profile is the core file *unmodified* — appended to, never edited
        # — so the two profiles cannot drift apart. Verified by object-for-object
        # comparison against the single file this replaced.
        # ⚠️ The banners go to **stderr**. This block's stdout is the SQL stream piped into
        # psql, so an echo here is not a log line, it is a syntax error on line 1.
        if [ "$${ZB_PROFILE}" = "readonly" ]; then
          echo "[bridge-init] profile: readonly (CDC + snapshots)" >&2
          cat /init.core.template.sql
        else
          echo "[bridge-init] profile: write-enabled (CDC + snapshots + ingress)" >&2
          cat /init.core.template.sql /init.write.template.sql
        fi | envsubst | psql -v ON_ERROR_STOP=1 -h "$${PG_HOST}" -p "$${PG_PORT}" -U "$${PG_USER}" -d "$${PG_DB}"
        # The templates create no publication (NOTES §10ad): the name was
        # substituted into them, which made it a second spelling of the bridge's
        # own --pub. It is an argument now, and this function is the only
        # supported way to make one — it also attaches the three internal tables
        # (ddl_events, gc_watermark, user_tenants) that a hand-made
        # `CREATE PUBLICATION` silently left out, crippling that bridge.
        psql -v ON_ERROR_STOP=1 -h "$${PG_HOST}" -p "$${PG_PORT}" -U "$${PG_USER}" -d "$${PG_DB}" \
          -c "SELECT step, status, detail FROM public.zebridge_create_publication('$${BRIDGE_CDC_PUBLICATION}')"
        echo "[bridge-init] Postgres initialization complete!"
    networks:
      - cdc-net
    restart: "no"

  # 7. ZeBridge itself.
  #
  # Started with the profile `bridge`, so the default `up` still leaves the bridge to
  # the host binary (the dev loop this repo is written around):
  #
  #   docker compose -f docker-compose.full.yml --env-file .env.docker --profile bridge up -d
  #
  # ⚠️ It was COMMENTED OUT for months, which meant the Dockerfile was never built and
  # never run. Two Linux-only compile errors had accumulated behind that comment —
  # `std.fs.openFileAbsolute` (moved onto std.Io.Dir in 0.16) and `_SC.PHYS_PAGES`
  # (musl does not define it) — both in branches a macOS build switches out at comptime.
  # A commented-out service is an untested service; a profile keeps it out of the
  # default `up` while still building and running on demand.
  bridge:
    profiles: ["bridge"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bridge
    ports:
      # Published on its own knob: the host dev loop usually holds 9090 already.
      - "${BRIDGE_PUBLISH_PORT}:${BRIDGE_PORT}"
    depends_on:
      bridge-init:
        condition: service_completed_successfully
      postgres-primary:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    env_file:
      - .env.docker
    volumes:
      # The wire grammar is NOT in the image — stream, subject and KV names are
      # deployment data, and baking them in would make the image deployment-specific.
      - ./grammar.json:/grammar.json:ro
    environment:
      # ⚠️ No PG_HOST/PG_PORT here. They used to be, pointing at 55432 (the PUBLISHED
      # port) from inside the network where it is 5432 — harmless only because the
      # bridge stopped assembling connections out of parts: DATABASE_READER_URL in
      # .env.docker is the single source, and it already names postgres-primary:5432.
      TOPOLOGY_PATH: /grammar.json
      # ⚠️ 0.0.0.0, and it MUST be. The default is 127.0.0.1, which inside a container
      # means the loopback of that container's own network namespace — so a published
      # port reaches nothing, and neither does another container. Measured: with the
      # default, `curl localhost:<published>/health` answered nothing at all, and the
      # browser client could not reach /enroll. The README's warning about 0.0.0.0
      # exposing unauthenticated telemetry is about a HOST process; here the namespace
      # is the boundary and the published port is the deliberate exposure.
      BRIDGE_BIND: 0.0.0.0
      # No seed mapping here. The bridge reads NATS_BRIDGE_NKEY_SEED — the same name
      # nats-init and nats-config-gen use — so .env.docker's copy reaches it through
      # env_file with nothing in between. A translation line
      # (`NATS_NKEY_SEED: ${NATS_BRIDGE_NKEY_SEED}`) is exactly the kind of second
      # spelling this whole day has been about removing.
      #
      # ⚠️ Direction check, since it is the one that matters: the SERVER holds the
      # PUBLIC key (nats-server.conf renders `nkey: "U…"` from NATS_BRIDGE_NKEY_PUB and
      # contains no seed at all), and the CLIENTS hold the seed. Never the reverse.
    # No --slot/--pub: BRIDGE_CDC_SLOT and BRIDGE_CDC_PUBLICATION are in .env.docker,
    # and this is exactly the flagless boot they exist for. Neither has a default, so
    # removing them from the env file stops the container rather than guessing.
    networks:
      - cdc-net
    restart: unless-stopped

  # 7b. The browser's single origin.
  #
  # A browser client needs two different things — the bridge's /enroll and NATS over
  # websocket — and they live on two ports that compose is free to move. The client
  # hardcoded both (`ws://localhost:8080`, `http://localhost:9090`) and broke the
  # moment either moved. One port in front of both, so the client knows one URL.
  edge:
    profiles: ["bridge"]
    image: nginx:alpine
    container_name: edge
    depends_on:
      bridge:
        condition: service_started
      nats-server:
        condition: service_started
    ports:
      - "${EDGE_PUBLISH_PORT}:8090"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cdc-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: zebridge_prometheus
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # ⚠️ 127.0.0.1, not the default. A bare "9091:9090" binds EVERY interface, so
      # this reaches anything that can route to the machine — a café network, a
      # colleague's laptop, a VPN peer. Prometheus, Grafana and the NATS exporter are
      # all unauthenticated by default and, between them, publish the table names,
      # per-table throughput, WAL lag, stream and consumer inventory, and the account
      # topology. None of them is a service; all three are a developer's own window
      # onto the stack, so loopback is the correct audience.
      #
      # Scraping is unaffected: Prometheus reaches `bridge:9090` and
      # `nats-exporter:7777` over the compose network, not through a published port.
      - "127.0.0.1:9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cdc-net

  grafana:
    image: grafana/grafana:latest
    container_name: zebridge_grafana
    ports:
      # Loopback, same reasoning as Prometheus above — Grafana ships with a known
      # default login and reads that Prometheus.
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./telemetry/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./telemetry/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./telemetry/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    depends_on:
      - prometheus
    networks:
      - cdc-net

  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    container_name: zebridge_nats_exporter
    command: [ "-jsz", "all", "-varz", "http://nats-server:8222" ]
    ports:
      # Loopback, same reasoning. Prometheus scrapes this over the compose network at
      # `nats-exporter:7777`, so publishing it at all is only for a human with curl.
      - "127.0.0.1:7777:7777"
    depends_on:
      - nats-server
    networks:
      - cdc-net
