services:
  # 1. Primary PostgreSQL (Source DB with Logical Replication)
  postgres-primary:
    image: postgres:18
    container_name: postgres-primary
    env_file:
      - .env.prod
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_DB: postgres
    ports:
      # Override PG_PUBLISH_PORT when a Postgres already listens on the host's 5432 —
      # a loopback-bound host server shadows Docker's wildcard bind for localhost.
      - "${PG_PUBLISH_PORT:-5432}:5432"
    volumes:
      # postgres:18+ wants the mount at /var/lib/postgresql, not .../data — it stores
      # data in a version-specific subdirectory so pg_upgrade --link can work.
      - postgres-primary-data:/var/lib/postgresql
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_slot_wal_keep_size=10GB"
      - "-c"
      - "wal_sender_timeout=300s"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - cdc-net

  # 2. Replica PostgreSQL (Target DB for Elixir Consumer)
  # postgres-replica:
  #   image: postgres:18
  #   container_name: postgres-replica
  #   environment:
  #     POSTGRES_PASSWORD: ${PG_PASSWORD}
  #     POSTGRES_USER: ${PG_USER}
  #     POSTGRES_DB: postgres
  #   ports:
  #     - "5433:5432"
  #   volumes:
  #     - postgres-replica-data:/var/lib/postgresql
  #   healthcheck:
  #     test: [ "CMD-SHELL", "pg_isready -U postgres" ]
  #     interval: 3s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - cdc-net

  # 3. NATS Configuration Generator
  nats-config-gen:
    image: busybox:latest
    container_name: nats-config-gen
    env_file:
      - .env.prod
    volumes:
      - nats-config:/config
      - ./nats-server.conf.template:/nats-server.conf.template:ro
    command:
      - sh
      - -c
      - |
        sed -e "s/\$${NATS_BRIDGE_USER}/$${NATS_BRIDGE_USER}/g" \
            -e "s/\$${NATS_BRIDGE_PASSWORD}/$${NATS_BRIDGE_PASSWORD}/g" \
            /nats-server.conf.template > /config/nats-server.conf
        echo "✓ Generated NATS config with credentials"
    networks:
      - cdc-net
    restart: "no"

  # 4. NATS JetStream Server
  nats-server:
    image: nats:latest
    container_name: nats-server
    depends_on:
      nats-config-gen:
        condition: service_completed_successfully
    ports:
      - "4222:4222" # Client TCP connections
      - "8222:8222" # HTTP monitoring
    volumes:
      - nats-data:/data
      - nats-config:/config:ro
    command: [ "-js", "-m", "8222", "-c", "/config/nats-server.conf" ]
    # No healthcheck: the nats image is distroless (no sh, no wget), so CMD-SHELL
    # probes can never pass. nats-init below polls for readiness itself.
    restart: unless-stopped
    networks:
      - cdc-net

  # 5. NATS Stream & KV Bucket Initializer
  nats-init:
    image: natsio/nats-box:latest
    container_name: nats-init
    networks:
      - cdc-net
    depends_on:
      nats-server:
        condition: service_started
    env_file:
      - .env.prod
    environment:
      - NATS_BRIDGE_USER=${NATS_BRIDGE_USER}
      - NATS_BRIDGE_PASSWORD=${NATS_BRIDGE_PASSWORD}
    command:
      - sh
      - -c
      - |
        set -e
        echo 'Waiting for NATS server...'
        until nats server check connection --server=nats://${NATS_BRIDGE_USER}:${NATS_BRIDGE_PASSWORD}@nats-server:4222 2>/dev/null; do
          sleep 1
        done
        echo 'Creating NATS JetStream stream: CDC'
        nats stream add CDC --server=nats://${NATS_BRIDGE_USER}:${NATS_BRIDGE_PASSWORD}@nats-server:4222 --subjects='cdc.>' --storage=file --retention=limits --max-age=1m --max-msgs=1000000 --max-bytes=1G --replicas=1 --compression s2 --defaults || true

        echo 'Creating NATS JetStream stream: INIT'
        nats stream add INIT --server=nats://${NATS_BRIDGE_USER}:${NATS_BRIDGE_PASSWORD}@nats-server:4222 --subjects='init.>' --storage=file --retention=limits --max-age=7d --max-msgs=10000000 --max-bytes=8G --replicas=1 --compression s2 --defaults || true

        echo 'Creating NATS KV buckets: schemas & dictionaries'
        nats kv add schemas --server=nats://${NATS_BRIDGE_USER}:${NATS_BRIDGE_PASSWORD}@nats-server:4222 --history=10 --replicas=1 || true
        nats kv add dictionaries --server=nats://${NATS_BRIDGE_USER}:${NATS_BRIDGE_PASSWORD}@nats-server:4222 --history=10 --replicas=1 || true
        echo 'NATS initialization complete!'
        exit 0
    restart: "no"

  # 6. Primary Postgres Initialization (Creates publication, users, test tables)
  bridge-init:
    image: postgres:18
    container_name: bridge-init
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - ./init.sql.template:/init.sql.template:ro
    env_file:
      - .env.prod
    environment:
      PGHOST: postgres-primary
      PGPORT: 5432
      PGUSER: ${PG_USER}
      PGPASSWORD: ${PG_PASSWORD}
      PGDATABASE: ${PG_DB}
      POSTGRES_BRIDGE_USER: ${POSTGRES_BRIDGE_USER}
      POSTGRES_BRIDGE_PASSWORD: ${POSTGRES_BRIDGE_PASSWORD}
      TARGET_DB: ${TARGET_DB}
      BRIDGE_CDC_TABLES: ${BRIDGE_CDC_TABLES}
      BRIDGE_CDC_PUBLICATION: ${BRIDGE_CDC_PUBLICATION}
    command:
      - /bin/bash
      - -c
      - |
        set -ex
        apt-get update && apt-get install -y gettext-base
        envsubst < /init.sql.template | psql -v ON_ERROR_STOP=1 -h "$${PGHOST}" -p "$${PGPORT}" -U "$${PGUSER}" -d "$${PGDATABASE}"
        echo "[bridge-init] Postgres initialization complete!"
    networks:
      - cdc-net
    restart: "no"

  # 7. ZeBridge (Zig CDC Bridge Server)
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bridge
    ports:
      - "${BRIDGE_PORT}:${BRIDGE_PORT}"
    depends_on:
      bridge-init:
        condition: service_completed_successfully
      postgres-primary:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    env_file:
      - .env.prod
    environment:
      PG_HOST: postgres-primary
      PG_PORT: 5432
      NATS_HOST: nats-server
    command:
      - "--slot"
      - "${BRIDGE_CDC_SLOT}"
      - "--pub"
      - "${BRIDGE_CDC_PUBLICATION}"
      - "--port"
      - "${BRIDGE_PORT}"
    networks:
      - cdc-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: zebridge_prometheus
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: zebridge_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
  # 8. Elixir Consumer App
  # consumer:
  #   build:
  #     context: ./consumer
  #     dockerfile: Dockerfile
  #   container_name: consumer
  #   depends_on:
  #     nats-init:
  #       condition: service_completed_successfully
  #     bridge:
  #       condition: service_started
  #     postgres-replica:
  #       condition: service_healthy
  #   env_file:
  #     - .env.prod
  #   environment:
  #     NATS_HOST: nats-server
  #     NATS_PORT: "4222"
  #     NATS_USER: ${NATS_BRIDGE_USER}
  #     NATS_PASSWORD: ${NATS_BRIDGE_PASSWORD}
  #     TABLES: ${BRIDGE_CDC_TABLES}
  #     FORMAT: msgpack
  #     PG_HOST: postgres-replica
  #     PG_PORT: 5432
  #     PG_USER: ${PG_USER}
  #     PG_PASSWORD: ${PG_PASSWORD}
  #     PG_DB: ${PG_DB}
  #   networks:
  #     - cdc-net
  #   restart: unless-stopped

volumes:
  postgres-primary-data:
    driver: local
  postgres-replica-data:
    driver: local
  nats-data:
    driver: local
  nats-config:
    driver: local

networks:
  cdc-net:
    driver: bridge
