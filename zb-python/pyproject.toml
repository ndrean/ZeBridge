[project]
name = "zebridge"
version = "0.1.0"
description = "ZeBridge client: a local replica of PostgreSQL through NATS, over libzb's C ABI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["postgresql", "nats", "jetstream", "offline-first", "sqlite", "replica", "sync"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/ndrean/zebridge"
Documentation = "https://github.com/ndrean/zebridge/blob/main/CLIENTS.md"
Issues = "https://github.com/ndrean/zebridge/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# A platform wheel carries libzb here (zebridge/lib/libzbcore.*); a source checkout
# finds the repository's build instead, or ZB_LIB.
zebridge = ["lib/*"]
