- name: Recreate valhalla
  ansible.builtin.command: docker compose up -d --force-recreate
  args:
    chdir: /opt/zebridge-routing
  changed_when: true
  when: zb_routing | bool and not ansible_check_mode   # the directory may be only pretended

- name: Restart routing
  ansible.builtin.systemd_service:
    name: routing
    state: restarted
    daemon_reload: true
  when: zb_routing | bool
