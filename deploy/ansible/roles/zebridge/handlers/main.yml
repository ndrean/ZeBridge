# The bridge stops cleanly on SIGTERM and resumes from its slot; clients reconnect.
- name: Restart admission
  ansible.builtin.systemd_service:
    name: zebridge-admission
    state: restarted
    daemon_reload: true
  when: zb_mutation_admission | bool

- name: Restart zebridge
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: [zebridge, zebridge-sweeper]
