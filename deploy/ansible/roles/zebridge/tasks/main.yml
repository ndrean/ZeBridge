# The bridge's two env files and its two services.
#   * .env.nats is the generated one (--init-nats): it holds the enrollment keys, so it is
#     edited in place, never rewritten;
#   * .env.bridge is the DBA's side: the database URLs, the slot, the publication.

- name: .env.bridge — the database URLs (secrets, written only where the file is missing)
  ansible.builtin.copy:
    dest: /etc/zebridge/.env.bridge
    owner: zebridge
    group: zebridge
    mode: "0600"
    content: |
      DATABASE_READER_URL={{ vault_database_reader_url }}
      DATABASE_WRITER_URL={{ vault_database_writer_url }}
    force: "{{ zb_rewrite_secrets | bool }}"   # an existing file stays (see vars.yml)
  no_log: true
  notify: Restart zebridge

- name: .env.bridge — the settings, line by line
  ansible.builtin.lineinfile:
    path: /etc/zebridge/.env.bridge
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true      # --check on a new server: the file above is not written yet
    owner: zebridge
    group: zebridge
    mode: "0600"
  loop: "{{ zb_bridge_settings | dict2items }}"
  vars:
    zb_bridge_settings:
      BRIDGE_CDC_PUBLICATION: "{{ zb_publication }}"
      BRIDGE_CDC_SLOT: "{{ zb_slot }}"
      GENERATIONS_ENABLED: "1"
      BASE_BUF: "{{ zb_base_buf }}"
      ENROLL_NATS_URL: "tls://{{ zb_host_nats }}:4222"
      ENROLL_NATS_WS_URL: "wss://{{ zb_host_ws }}:443"
  notify: Restart zebridge

# 4222 speaks TLS only: the bridge dials it by name (the certificate's), which /etc/hosts
# keeps on this machine.
- name: .env.nats — the bridge dials NATS over TLS
  ansible.builtin.lineinfile:
    path: /etc/zebridge/.env.nats
    regexp: '^NATS_URL='
    line: "NATS_URL=tls://{{ zb_host_nats }}:4222"
  notify: Restart zebridge

- name: .env.nats — the JWT lifetime handed to clients
  ansible.builtin.lineinfile:
    path: /etc/zebridge/.env.nats
    regexp: '^ENROLL_JWT_TTL_SECONDS='
    line: "ENROLL_JWT_TTL_SECONDS={{ enroll_jwt_ttl_seconds }}"
  notify: Restart zebridge

- name: The bridge's secrets belong to its user
  ansible.builtin.file:
    path: "{{ item }}"
    owner: zebridge
    mode: "0600"
  loop: [/etc/zebridge/.env.nats, /etc/zebridge/creds/bridge.creds]

- name: The bridge and the sweeper as services
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.unit }}.service"
    mode: "0644"
    content: |
      [Unit]
      After={{ item.after }}
      {% if item.unit == 'zebridge' %}Wants=nats.service
      {% endif %}

      [Service]
      User=zebridge
      EnvironmentFile=/etc/zebridge/.env.nats
      EnvironmentFile=/etc/zebridge/.env.bridge
      ExecStart={{ zb_bin }}/{{ item.bin }}
      Restart=on-failure
      RestartSec={{ item.restart_sec }}

      [Install]
      WantedBy=multi-user.target
  loop:
    - { unit: zebridge, bin: bridge, after: "nats.service network-online.target", restart_sec: 5 }
    - { unit: zebridge-sweeper, bin: bridge_sweeper, after: zebridge.service, restart_sec: 30 }
  notify: Restart zebridge

- name: Both running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [zebridge, zebridge-sweeper]
