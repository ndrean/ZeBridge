# The bridge's two env files and its two services.
#   * .env.nats is the generated one (--init-nats): it holds the enrollment keys, so it is
#     edited in place, never rewritten;
#   * .env.bridge is the DBA's side: the database URLs, the slot, the publication.

- name: .env.bridge — the database URLs (secrets, written only where the file is missing)
  ansible.builtin.copy:
    dest: /etc/zebridge/.env.bridge
    owner: zebridge
    group: zebridge
    mode: "0600"
    content: |
      DATABASE_READER_URL={{ vault_database_reader_url }}
      DATABASE_WRITER_URL={{ vault_database_writer_url }}
    force: "{{ zb_rewrite_secrets | bool }}"   # an existing file stays (see vars.yml)
  no_log: true
  notify: Restart zebridge

- name: .env.bridge — the settings, line by line
  ansible.builtin.lineinfile:
    path: /etc/zebridge/.env.bridge
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true      # --check on a new server: the file above is not written yet
    owner: zebridge
    group: zebridge
    mode: "0600"
  loop: "{{ zb_bridge_settings | dict2items }}"
  vars:
    zb_bridge_settings:
      BRIDGE_CDC_PUBLICATION: "{{ zb_publication }}"
      BRIDGE_CDC_SLOT: "{{ zb_slot }}"
      GENERATIONS_ENABLED: "1"
      BASE_BUF: "{{ zb_base_buf }}"
      NATS_ACCOUNT_CONF: /etc/zebridge/nats-server.conf
      ENROLL_NATS_URL: "tls://{{ zb_host_nats }}:4222"
      ENROLL_NATS_WS_URL: "wss://{{ zb_host_ws }}:443"
      MUTATION_ADMISSION: "{{ zb_mutation_admission | bool | ternary('1', '0') }}"
      MUTATION_BACKLOG_PER_PRINCIPAL: "{{ zb_mutation_backlog }}"
      MUTATION_BACKLOG_BYTES_PER_PRINCIPAL: "{{ zb_mutation_backlog_bytes }}"
      MUTATION_MAX_MESSAGE_BYTES: "{{ zb_mutation_message_bytes }}"
      MUTATION_STREAM_MAX_BYTES: "{{ zb_mutation_stream_bytes }}"
      MUTATION_RATE_PER_PRINCIPAL: "{{ zb_mutation_rate }}"
      MUTATION_RATE_BURST: "{{ zb_mutation_burst }}"
  notify: Restart zebridge

- name: The bridge may read public account claims for leaf trust refresh
  ansible.posix.acl:
    path: /etc/zebridge/nats-server.conf
    entity: zebridge
    etype: user
    permissions: r
    state: present

# 4222 speaks TLS only: the bridge dials it by name (the certificate's), which /etc/hosts
# keeps on this machine.
- name: .env.nats — the bridge dials NATS over TLS
  ansible.builtin.lineinfile:
    path: /etc/zebridge/.env.nats
    regexp: '^NATS_URL='
    line: "NATS_URL=tls://{{ zb_host_nats }}:4222"
  notify: Restart zebridge

- name: Admission policy and NATS address (no PostgreSQL credentials)
  ansible.builtin.copy:
    dest: /etc/zebridge/.env.admission
    owner: root
    group: zebridge
    mode: "0640"
    content: |
      NATS_URL=tls://{{ zb_host_nats }}:4222
      NATS_CREDS=/etc/zebridge/creds/bridge.creds
      NATS_JS_DOMAIN={{ zb_js_domain }}
      ZB_LEAF_NAMES="{{ groups['leaves'] | default([]) | map('extract', hostvars, 'leaf_name') | join(' ') }}"
      MUTATION_BACKLOG_PER_PRINCIPAL={{ zb_mutation_backlog }}
      MUTATION_BACKLOG_BYTES_PER_PRINCIPAL={{ zb_mutation_backlog_bytes }}
      MUTATION_MAX_MESSAGE_BYTES={{ zb_mutation_message_bytes }}
      MUTATION_STREAM_MAX_BYTES={{ zb_mutation_stream_bytes }}
  notify: Restart admission

- name: The mutation admission service
  ansible.builtin.copy:
    dest: /etc/systemd/system/zebridge-admission.service
    mode: "0644"
    content: |
      [Unit]
      After=nats.service network-online.target
      Wants=nats.service
      [Service]
      User=zebridge
      EnvironmentFile=/etc/zebridge/.env.admission
      ExecStart={{ zb_bin }}/bridge --mutation-ingress
      Restart=on-failure
      RestartSec=5
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectHome=true
      [Install]
      WantedBy=multi-user.target
  notify: Restart admission

- name: .env.nats — the JWT lifetime handed to clients
  ansible.builtin.lineinfile:
    path: /etc/zebridge/.env.nats
    regexp: '^ENROLL_JWT_TTL_SECONDS='
    line: "ENROLL_JWT_TTL_SECONDS={{ enroll_jwt_ttl_seconds }}"
  notify: Restart zebridge

- name: The bridge's secrets belong to its user
  ansible.builtin.file:
    path: "{{ item }}"
    owner: zebridge
    mode: "0600"
  loop: [/etc/zebridge/.env.nats, /etc/zebridge/creds/bridge.creds]

- name: Admission running when enabled
  ansible.builtin.systemd_service:
    name: zebridge-admission
    enabled: "{{ zb_mutation_admission | bool }}"
    state: "{{ zb_mutation_admission | bool | ternary('started', 'stopped') }}"
    daemon_reload: true
  # --check does not write the unit above: on a hub that never had admission, systemd has
  # no such service yet and the dry run stopped here (0.2.7 upgrade, 2026-10-22).
  ignore_errors: "{{ ansible_check_mode }}"

- name: The bridge and the sweeper as services
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.unit }}.service"
    mode: "0644"
    content: |
      [Unit]
      After={{ item.after }}
      {% if item.unit == 'zebridge' %}Wants=nats.service
      {% endif %}

      [Service]
      User=zebridge
      EnvironmentFile=/etc/zebridge/.env.nats
      EnvironmentFile=/etc/zebridge/.env.bridge
      {% if item.unit == 'zebridge' and zb_mutation_admission | bool %}
      ExecStartPre={{ zb_bin }}/bridge --mutation-ingress --check
      {% endif %}
      ExecStart={{ zb_bin }}/{{ item.bin }}
      Restart=on-failure
      RestartSec={{ item.restart_sec }}

      [Install]
      WantedBy=multi-user.target
  loop:
    - { unit: zebridge, bin: bridge, after: "nats.service network-online.target", restart_sec: 5 }
    - { unit: zebridge-sweeper, bin: bridge_sweeper, after: zebridge.service, restart_sec: 30 }
  notify: Restart zebridge

- name: Both running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [zebridge, zebridge-sweeper]
