- name: Restart nats
  ansible.builtin.systemd_service:
    name: nats
    state: restarted
    daemon_reload: true

# The trust changed: a reload reads it again without dropping the devices.
- name: Reload nats
  ansible.builtin.systemd_service:
    name: nats
    state: reloaded

- name: Restart mirrors
  ansible.builtin.systemd_service:
    name: zebridge-mirrors
    state: restarted
    daemon_reload: true
  when: leaf_js_domain | length > 0
