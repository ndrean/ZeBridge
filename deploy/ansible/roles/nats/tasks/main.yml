# The NATS configuration comes from the bridge (`--init-nats operator`), ONCE: running it
# again would make a new operator, and every enrolled device would be refused. Then the
# listeners are set, each edit checked by `nats-server -t` before it is written.

- name: The configuration, generated once (operator, accounts, the bridge's creds)
  ansible.builtin.command: >-
    bridge --init-nats operator --dir /etc/zebridge
    {{ ('--js-domain ' + zb_js_domain) if zb_js_domain else '' }}
  args:
    creates: /etc/zebridge/nats-server.conf

# What is already in the file: a server set up by hand keeps its own blocks (a second
# `tls {}` or `leafnodes {}` beside them would not be the same server).
- name: The configuration as it is
  ansible.builtin.slurp:
    src: /etc/zebridge/nats-server.conf
  register: nats_conf_raw
  check_mode: false

- name: The configuration's text
  ansible.builtin.set_fact:
    nats_conf: "{{ nats_conf_raw.content | b64decode }}"

# A stack made before its first leaf: the domain is added once, by the bridge, which
# re-signs the grants with both API prefixes (needs operator.store on the server).
- name: The JetStream domain, added to a stack that has none
  ansible.builtin.command: bridge --init-nats --update --dir /etc/zebridge --js-domain {{ zb_js_domain }}
  when: >-
    zb_js_domain | length > 0 and nats_conf is not search('(?m)^ *domain: *' + zb_js_domain + ' *$')
  changed_when: true
  notify: [Restart nats, Restart zebridge]

- name: JetStream's directory
  ansible.builtin.file:
    path: /etc/zebridge/nats-data
    state: directory
    owner: nats
    group: nats
    mode: "0750"

# Monitoring (/varz, /jsz) for the exporter on this host only: it lists connections and
# subjects.
- name: Monitoring on loopback
  ansible.builtin.replace:
    path: /etc/zebridge/nats-server.conf
    regexp: '^http_port: 8222$'
    replace: 'http: "127.0.0.1:8222"'
    validate: nats-server -t -c %s
  notify: Restart nats

# Clients on the internet: TLS on 4222 with the Let's Encrypt certificate. Every client of
# this port must then use TLS — the bridge and the services included (tls://nats.<domain>).
- name: TLS on the client port, and a ping under Cloudflare's 100 s idle cut
  when: >-
    nats_conf is not search('(?m)^tls [{]') or nats_conf is search('BEGIN zebridge ansible: client TLS')
  ansible.builtin.blockinfile:
    path: /etc/zebridge/nats-server.conf
    marker: "# {mark} zebridge ansible: client TLS"
    insertafter: '^port: 4222$'
    block: |
      tls {
        cert_file: "/etc/zebridge/tls/nats.crt"
        key_file:  "/etc/zebridge/tls/nats.key"
      }
      ping_interval: "1m"
    validate: nats-server -t -c %s
  notify: Restart nats

# Browsers through Cloudflare ("Full (strict)"): TLS with the origin certificate.
- name: The websocket listener with TLS
  ansible.builtin.replace:
    path: /etc/zebridge/nats-server.conf
    regexp: '(?ms)^websocket \{\n  port: 8080\n  no_tls: true\n\}'
    replace: |-
      websocket {
        port: 8080
        tls {
          cert_file: "/etc/zebridge/tls/origin.crt"
          key_file:  "/etc/zebridge/tls/origin.key"
        }
      }
    validate: nats-server -t -c %s
  notify: Restart nats

# The leaves' door: 7422 with the client port's certificate (the leaves dial
# tls://nats.<domain>:7422). Each leaf joins with its own creds (bridge --mint-leaf).
- name: The leafnodes listener
  when: >-
    zb_leaf_addresses | length > 0 and
    (nats_conf is not search('(?m)^leafnodes [{]') or nats_conf is search('BEGIN zebridge ansible: leafnodes'))
  ansible.builtin.blockinfile:
    path: /etc/zebridge/nats-server.conf
    marker: "# {mark} zebridge ansible: leafnodes"
    block: |
      leafnodes {
        port: 7422
        no_advertise: true
        tls {
          cert_file: "/etc/zebridge/tls/nats.crt"
          key_file:  "/etc/zebridge/tls/nats.key"
        }
      }
    validate: nats-server -t -c %s
  notify: Restart nats

- name: The nats.service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/nats.service
    mode: "0644"
    content: |
      [Unit]
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=nats
      ExecStart=/usr/local/bin/nats-server -c /etc/zebridge/nats-server.conf
      ExecReload=/bin/kill -s HUP $MAINPID
      Restart=on-failure
      LimitNOFILE=65536

      [Install]
      WantedBy=multi-user.target
  notify: Restart nats

- name: NATS running
  ansible.builtin.systemd_service:
    name: nats
    enabled: true
    state: started
    daemon_reload: true

- name: Restart NATS now if its configuration changed, before the bridge starts
  ansible.builtin.meta: flush_handlers
