# Leaf nodes (main README, "Adding a leaf node"): a nats-server near a group of devices,
# joined with tenant-scoped credentials; an optional domain enables seeding caches.
#
#   ansible-playbook leaf.yml --ask-vault-pass
#
# Three plays, because a leaf needs two things only the hub has: the trust lines of its
# nats-server.conf (the operator and the accounts), and a leaf credential minted from
# operator.store. They travel through Ansible's memory, never through a file here.

- name: What each leaf already holds
  hosts: leaves
  become: true
  gather_facts: false
  tasks:
    - name: Each leaf has an explicit tenant policy
      ansible.builtin.assert:
        that:
          - leaf_tenants is sequence and leaf_tenants is not string
          - leaf_tenants | length > 0
          - leaf_tenants | reject('match', '^[A-Za-z0-9_-]+$') | list | length == 0
          - leaf_name is match('^[A-Za-z0-9_-]{1,64}$')
        fail_msg: Set leaf_tenants to an explicit nonempty list and reserve leaf_name in zebridge_leaf_scopes before enrollment.

    - name: The keeper credentials, if any
      ansible.builtin.stat:
        path: "/etc/zebridge/creds/{{ leaf_name }}-keeper.creds"
      register: leaf_keeper_file

    - name: The leaf's credentials, if any
      ansible.builtin.stat:
        path: "/etc/zebridge/creds/{{ leaf_name }}.creds"
      register: leaf_creds_file

    - name: The existing identity is restricted to leaf-node connections
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import base64, json, re, sys
            text = open(sys.argv[1]).read()
            token = re.search(r'-----BEGIN NATS USER JWT-----\s*(\S+)', text).group(1)
            claims = json.loads(base64.urlsafe_b64decode(token.split('.')[1] + '==='))
            claim = claims['nats']
            grants = claim.get('pub', {}).get('allow', [])
            safe = claim.get('allowed_connection_types') == ['LEAFNODE'] and not any(
                ('STREAM.CREATE' in p and '.OBJ_res-' not in p) or 'STREAM.DELETE' in p for p in grants)
            safe = safe and sorted(claim.get('tags', [])) == sorted(['leaf-policy:1', 'leaf:' + sys.argv[3]] + ['tenant:' + t for t in json.loads(sys.argv[2])])
            safe = safe and ('$ZB.MIRROR.' + sys.argv[3] + '.>' in claim.get('sub', {}).get('allow', [])) == (sys.argv[4] == 'mirror')
            safe = safe and ('$JS.' + sys.argv[5] + '.API.INFO' in grants)
            print(claims.get("sub", ""))
            sys.exit(0 if safe else 1)
          - "/etc/zebridge/creds/{{ leaf_name }}.creds"
          - "{{ leaf_tenants | to_json }}"
          - "{{ leaf_name }}"
          - "{{ 'mirror' if leaf_js_domain | length else 'forward' }}"
          - "{{ hostvars[leaf_hub].zb_js_domain }}"
      when: leaf_creds_file.stat.exists
      register: leaf_creds_restricted
      changed_when: false
      failed_when: false
      no_log: true
      check_mode: false

    - name: The existing keeper matches the leaf policy and loopback restriction
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import base64, json, re, sys
            token = re.search(r'-----BEGIN NATS USER JWT-----\s*(\S+)', open(sys.argv[1]).read()).group(1)
            claims = json.loads(base64.urlsafe_b64decode(token.split('.')[1] + '==='))
            limits = claims['nats']
            expected = sorted(['leaf-policy:1', 'leaf:' + sys.argv[3]] + ['tenant:' + t for t in json.loads(sys.argv[2])])
            safe = claims.get('name') == sys.argv[3] and sorted(limits.get('tags', [])) == expected
            safe = safe and limits.get('allowed_connection_types') == ['STANDARD'] and sorted(limits.get('src', [])) == ['127.0.0.1/32', '::1/128']
            safe = safe and ('$JS.' + sys.argv[4] + '.API.STREAM.INFO.OBJ_gen-_default' in limits.get('pub', {}).get('allow', []))
            print(claims.get('sub', ''))
            sys.exit(0 if safe else 1)
          - "/etc/zebridge/creds/{{ leaf_name }}-keeper.creds"
          - "{{ leaf_tenants | to_json }}"
          - "{{ leaf_name }}"
          - "{{ hostvars[leaf_hub].zb_js_domain }}"
      when: leaf_keeper_file.stat.exists
      register: leaf_keeper_restricted
      changed_when: false
      failed_when: false
      no_log: true
      check_mode: false

- name: From the hub, its trust and the missing leaf credentials
  hosts: zebridge
  become: true
  gather_facts: false
  tasks:
    # zb_bin (group_vars) reads them: our bridge is /usr/bin/bridge from the package, or
    # /usr/local/bin/bridge from a raw build. A bare `bridge` run as root finds iproute2's
    # /usr/sbin/bridge first on Debian.
    - name: The packages installed
      ansible.builtin.package_facts:

    - name: The hub's NATS configuration
      ansible.builtin.slurp:
        src: /etc/zebridge/nats-server.conf
      register: hub_conf_raw
      check_mode: false

    # From `operator:` to the end of `resolver_preload { … }`: who signs, and the accounts.
    # The account key is the one the leaves' remote binds to.
    - name: The trust lines and the ZEBRIDGE account key
      ansible.builtin.set_fact:
        hub_trust: "{{ hub_conf_raw.content | b64decode | regex_search('(?ms)^operator: .*?^resolver_preload: [{].*?^[}]') }}"
        hub_account: "{{ hub_conf_raw.content | b64decode | regex_findall('Account \"ZEBRIDGE\"[^A]*(A[A-Z2-7]{55})') | first }}"

    - name: Both found
      ansible.builtin.assert:
        that: [hub_trust | length > 0, hub_account | length == 56]
        fail_msg: the hub's nats-server.conf has no operator/resolver_preload block, or no ZEBRIDGE account
        quiet: true

    # Minted only for a leaf that has none (or on request): every mint is a new user, and
    # the leaf would restart for nothing.
    - name: A credential for each leaf that has none (bridge --mint-leaf)
      ansible.builtin.command:
        argv: "{{ [zb_bin ~ '/bridge', '--mint-leaf', '--name', hostvars[item].leaf_name, '--store', '/etc/zebridge/operator.store'] + (['--mirror'] if hostvars[item].leaf_js_domain | default('') | length else []) + (['--tenant'] | product(hostvars[item].leaf_tenants) | list | flatten) }}"
      loop: "{{ groups['leaves'] }}"
      when: >-
        zb_rewrite_secrets | bool or not hostvars[item].leaf_creds_file.stat.exists
        or hostvars[item].leaf_creds_restricted.rc | default(1) != 0
      register: hub_leaf_mints
      changed_when: true
      no_log: true

    - name: A separate loopback keeper identity for each seeding leaf
      ansible.builtin.command:
        argv: "{{ [zb_bin ~ '/bridge', '--mint-leaf', '--keeper', '--name', hostvars[item].leaf_name, '--store', '/etc/zebridge/operator.store'] + (['--tenant'] | product(hostvars[item].leaf_tenants) | list | flatten) }}"
      loop: "{{ groups['leaves'] }}"
      when:
        - hostvars[item].leaf_js_domain | default('') | length > 0
        - zb_rewrite_secrets | bool or not hostvars[item].leaf_keeper_file.stat.exists or hostvars[item].leaf_keeper_restricted.rc | default(1) != 0
      register: hub_keeper_mints
      changed_when: true
      no_log: true

- name: The leaves
  hosts: leaves
  become: true
  # The settings and secrets the hub's group has (the domain, nats_version, the
  # Cloudflare token for certbot), read when the play runs.
  pre_tasks:
    - name: The hub's settings and secrets (group_vars/zebridge)
      ansible.builtin.include_vars:
        dir: group_vars/zebridge
  roles:
    - leaf
