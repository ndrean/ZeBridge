[defaults]
inventory = inventory.yml
roles_path = roles
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# The service users have no home directory: Ansible's own scratch space goes to /tmp.
remote_tmp = /tmp/.ansible-${USER}/tmp

[privilege_escalation]
become = true

[connection]
# Modules go through ssh's stdin, with no temporary file: becoming the unprivileged
# `zebridge` (verify) needs no file permissions then, and every task is faster.
pipelining = true
