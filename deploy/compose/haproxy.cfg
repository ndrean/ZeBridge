# HAProxy for the compose stack: clients connect directly (no CDN in front), so the
# client's address is the connection's own.
#
#   https://${BRIDGE_HOST}   -> bridge:27434   GET /enroll /renew /status only, rate-limited
#   wss://${WS_HOST}         -> nats:8080      the NATS websocket, for browsers
#   http://…/.well-known/acme-challenge/  -> certbot:8888 (renewals); anything else -> https
#
# Native clients do not cross HAProxy: they connect to NATS on NATS_PUBLIC_PORT with TLS.

global
    log stdout format raw local0
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2

# Docker's DNS: the services may start after HAProxy, and their addresses may change.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    log global
    mode http
    # httplog's format, the request line without its query string: /enroll?code=… carries
    # an invite, and a log is no place for a secret that still works.
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs \"%HM %HP %HV\""
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    # IPv4 to the services: the network also has IPv6 (compose.yml), Docker's DNS then
    # answers both, HAProxy would pick IPv6, and the services listen on IPv4.
    default-server init-addr last,libc,none resolvers docker resolve-prefer ipv4

frontend http_in
    bind :80
    acl acme path_beg /.well-known/acme-challenge/
    # http-request rules run before use_backend: the redirect must spare the challenge.
    http-request redirect scheme https code 301 unless acme
    use_backend bk_acme if acme

frontend https_in
    bind :443 ssl crt /certs/haproxy.pem alpn http/1.1

    # Two counters per client address over 10 s: every request (sc0), and /enroll alone
    # (sc1), so reading /status never spends the enrolment budget.
    stick-table type ipv6 size 100k expire 1m store http_req_rate(10s)
    http-request track-sc0 src
    http-request track-sc1 src table bk_enroll_rate if { path /enroll }

    # The name without its port: the same rules on 443 or on any other published port.
    acl host_bridge hdr(host),field(1,:) -i "${BRIDGE_HOST}"
    acl host_ws     hdr(host),field(1,:) -i "${WS_HOST}"
    use_backend bk_bridge if host_bridge
    use_backend bk_ws if host_ws
    # Any other name. Not an http-request rule here: those run before use_backend.
    default_backend bk_unknown_host

backend bk_bridge
    # Only three paths, and only as GET.
    acl path_enroll path /enroll
    acl path_renew  path /renew
    acl path_status path /status
    http-request deny deny_status 404 if !path_enroll !path_renew !path_status
    http-request deny deny_status 405 if !METH_GET

    # Enrolment: 30 per 10 s per client address (proxy/haproxy.cfg says why: a code is
    # 122 random bits; devices behind one address enroll together; the bridge caps itself).
    http-request deny deny_status 429 if path_enroll { sc_http_req_rate(1) gt 30 }
    # Renewal is signed by the client's key (nothing to guess); /status names tables.
    http-request deny deny_status 429 if path_renew { sc_http_req_rate(0) gt 20 }
    http-request deny deny_status 429 if path_status { sc_http_req_rate(0) gt 20 }

    server bridge bridge:27434 maxconn 100 check

backend bk_ws
    # Only websocket upgrades reach NATS. A plain request (scanners find the name in the
    # certificate logs within minutes) is answered here, not logged by NATS as an error.
    http-request deny deny_status 400 unless { req.hdr(upgrade) -i websocket }
    # A websocket stays open: the tunnel timeout replaces the client/server ones once
    # upgraded. nats-server pings it, so an idle browser is not cut.
    timeout tunnel 1h
    server nats nats:8080 check

backend bk_acme
    server certbot certbot:8888

backend bk_unknown_host
    http-request deny deny_status 404

# The /enroll counter's table (a backend only holds it; nothing is routed here).
backend bk_enroll_rate
    stick-table type ipv6 size 100k expire 1m store http_req_rate(10s)
