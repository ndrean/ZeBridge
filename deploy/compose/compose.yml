# ZeBridge on one server with Docker Compose: NATS, the bridge, the sweeper, HAProxy and
# Let's Encrypt, optionally PostgreSQL, and optionally the telemetry (Alloy, sending metrics
# and logs to a store elsewhere). This file and a .env are all a server needs: the
# configuration ships inside the release's image.
#
#   docker compose up -d     # COMPOSE_PROFILES in .env: postgres, telemetry, or both
#
# Published ports: 80 (Let's Encrypt, redirect), 443 (bridge + websocket), NATS_PUBLIC_PORT
# (native clients, TLS). PostgreSQL, NATS monitoring and the bridge's /metrics stay on the
# compose network. Docker's published ports bypass ufw. README.md has the steps.

# Every service logs to the host's journal, tagged with its container name: `docker compose
# logs` reads it back, and Alloy (profile "telemetry") sends it on. ZB_LOG_DRIVER=json-file
# for a host without systemd-journald.
x-logging: &logging
  driver: ${ZB_LOG_DRIVER:-journald}

x-zebridge: &zebridge
  image: ghcr.io/ndrean/zebridge:${ZB_VERSION:-0.2.8}
  restart: unless-stopped
  init: true   # a small init as PID 1 passes SIGTERM on: a stop takes ms, not Docker's 10 s
  logging: *logging

x-db: &db
  DATABASE_READER_URL: ${DATABASE_READER_URL:-postgres://zb_reader:${ZB_READER_PASSWORD}@postgres:5432/zebridge}
  DATABASE_WRITER_URL: ${DATABASE_WRITER_URL:-postgres://zb_writer:${ZB_WRITER_PASSWORD}@postgres:5432/zebridge}
  BRIDGE_CDC_PUBLICATION: ${BRIDGE_CDC_PUBLICATION:-zb_pub}
  BRIDGE_CDC_SLOT: ${BRIDGE_CDC_SLOT:-zb_slot}

x-admission: &admission
  MUTATION_ADMISSION: "1"
  ZB_LEAF_NAMES: ${ZB_LEAF_NAMES:-}
  MUTATION_BACKLOG_PER_PRINCIPAL: ${MUTATION_BACKLOG_PER_PRINCIPAL:-5000}
  MUTATION_BACKLOG_BYTES_PER_PRINCIPAL: ${MUTATION_BACKLOG_BYTES_PER_PRINCIPAL:-67108864}
  MUTATION_MAX_MESSAGE_BYTES: ${MUTATION_MAX_MESSAGE_BYTES:-65536}
  MUTATION_STREAM_MAX_BYTES: ${MUTATION_STREAM_MAX_BYTES:-1073741824}

services:
  # ── configuration ───────────────────────────────────────────────────────────────
  # HAProxy's and Alloy's files and the scripts, from the release's image into the zb-conf
  # volume, at every start: they follow ZB_VERSION.
  conf-init:
    <<: *zebridge
    user: root
    entrypoint: ["/bin/sh", "/usr/share/zebridge/compose/scripts/conf-init.sh"]
    volumes:
      - zb-conf:/conf
    restart: "no"

  # ── certificates ─────────────────────────────────────────────────────────────────
  # One certificate for the three names, issued and renewed through HAProxy, which alone
  # holds port 80. Until Let's Encrypt's arrives, a temporary self-signed one lets HAProxy
  # and NATS start (scripts/certbot-run.sh).
  certbot:
    image: certbot/certbot:v5.8.0
    logging: *logging
    init: true
    entrypoint: ["/bin/sh", "/conf/scripts/certbot-run.sh"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      DOMAINS: ${BRIDGE_HOST:?set BRIDGE_HOST in .env} ${WS_HOST:?set WS_HOST in .env} ${NATS_HOST:?set NATS_HOST in .env}
    depends_on:
      conf-init: { condition: service_completed_successfully }
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certs:/certs
      - zb-conf:/conf:ro
    restart: unless-stopped

  # ── NATS ─────────────────────────────────────────────────────────────────────────
  # The operator, the accounts and the bridge's creds, generated ONCE into the zb-etc
  # volume: running it again would make a new operator, and every enrolled device would be
  # refused. operator.store (the root seeds) is in that volume too: copy it off the server.
  nats-init:
    <<: *zebridge
    user: root
    entrypoint: ["/bin/sh", "/usr/share/zebridge/compose/scripts/nats-init.sh"]
    environment:
      NATS_HOST: ${NATS_HOST:?}
    volumes:
      - zb-etc:/etc/zebridge
    restart: "no"

  nats:
    image: nats:2.15.0-alpine
    logging: *logging
    init: true
    entrypoint: ["/bin/sh", "/conf/scripts/nats-run.sh"]
    depends_on:
      nats-init: { condition: service_completed_successfully }
      certbot: { condition: service_started }   # it puts the certificate in place first
    # Healthy once nats-server answers, which it does only on Let's Encrypt's certificate
    # (scripts/nats-run.sh): `docker compose up` waits here through the first issuance, a
    # few seconds to a minute, then starts admission and the bridge. A certificate that
    # never comes (a name not pointing here, port 80 closed) ends as unhealthy after the
    # start period; certbot's log says why.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      start_period: 5m
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3
    ports: ["${NATS_PUBLIC_PORT:-4222}:4222"]
    volumes:
      - zb-etc:/etc/zebridge
      - certs:/certs:ro
      - zb-conf:/conf:ro
    networks:
      default:
        # The bridge dials tls://<NATS_HOST>:4222: the certificate's name, this container.
        aliases: ["${NATS_HOST}"]
    restart: unless-stopped

  # ── the bridge ───────────────────────────────────────────────────────────────────
  admission:
    <<: *zebridge
    entrypoint: ["/bin/sh", "-c", "set -a; . /etc/zebridge/.env.nats; set +a; exec bridge --mutation-ingress"]
    healthcheck:
      test: ["CMD-SHELL", "set -a; . /etc/zebridge/.env.nats; set +a; bridge --mutation-ingress --check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      <<: *admission
    depends_on:
      nats: { condition: service_healthy }
    volumes:
      - zb-etc:/etc/zebridge:ro

  bridge:
    <<: *zebridge
    entrypoint: ["/bin/sh", "-c", "set -a; . /etc/zebridge/.env.nats; set +a; exec bridge"]
    environment:
      <<: [*db, *admission]
      NATS_ACCOUNT_CONF: /etc/zebridge/nats-server.conf
      GENERATIONS_ENABLED: "1"
      BRIDGE_BIND: 0.0.0.0          # the compose network only: 27434 is not published
      BASE_BUF: ${BASE_BUF:-13}
      ENROLL_NATS_URL: tls://${NATS_HOST}:${NATS_PUBLIC_PORT:-4222}
      ENROLL_NATS_WS_URL: wss://${WS_HOST}:443
      MUTATION_RATE_PER_PRINCIPAL: ${MUTATION_RATE_PER_PRINCIPAL:-100}
      MUTATION_RATE_BURST: ${MUTATION_RATE_BURST:-200}
    depends_on:
      nats: { condition: service_healthy }
      admission: { condition: service_healthy }
      pg-init: { condition: service_completed_successfully, required: false }
    volumes:
      - zb-etc:/etc/zebridge

  sweeper:
    <<: *zebridge
    entrypoint: ["bridge_sweeper"]
    environment:
      DATABASE_WRITER_URL: ${DATABASE_WRITER_URL:-postgres://zb_writer:${ZB_WRITER_PASSWORD}@postgres:5432/zebridge}
    depends_on:
      bridge: { condition: service_started }

  # ── HAProxy: 80 and 443 ──────────────────────────────────────────────────────────
  haproxy:
    image: haproxy:3.4.6-alpine
    logging: *logging
    init: true
    entrypoint: ["/bin/sh", "/conf/scripts/haproxy-run.sh"]
    environment:
      BRIDGE_HOST: ${BRIDGE_HOST}
      WS_HOST: ${WS_HOST}
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"   # the image runs as the haproxy user
    ports: ["80:80", "443:443"]
    depends_on:
      certbot: { condition: service_started }   # it puts the certificate in place first
    volumes:
      - certs:/certs:ro
      - zb-conf:/conf:ro
    restart: unless-stopped

  # ── telemetry (profile "telemetry"): the NATS exporter and Alloy ──────────────────
  # Alloy sends the metrics (Prometheus remote write) and the logs (Loki push) to the store
  # named in .env: Grafana Cloud, OpenObserve, any compatible one. Nothing is kept here.
  nats-exporter:
    profiles: [telemetry]
    image: natsio/prometheus-nats-exporter:0.20.2
    logging: *logging
    command: ["-port", "7777", "-jsz", "all", "-varz", "-connz", "-leafz", "http://nats:8222"]
    depends_on:
      nats: { condition: service_started }
    restart: unless-stopped

  alloy:
    profiles: [telemetry]
    image: grafana/alloy:v1.21.2
    logging: *logging
    command: ["run", "/conf/alloy/config.alloy", "--storage.path=/var/lib/alloy/data",
              "--server.http.listen-addr=127.0.0.1:12345"]
    environment:
      # No ${…:?} here: compose interpolates every service, profile or not. Alloy says which
      # one is missing when the profile is on (README.md, "Metrics and logs").
      ZB_METRICS_URL: ${ZB_METRICS_URL:-}
      ZB_METRICS_USER: ${ZB_METRICS_USER:-}
      ZB_METRICS_PASSWORD: ${ZB_METRICS_PASSWORD:-}
      ZB_LOGS_URL: ${ZB_LOGS_URL:-}
      ZB_LOGS_USER: ${ZB_LOGS_USER:-}
      ZB_LOGS_PASSWORD: ${ZB_LOGS_PASSWORD:-}
      ZB_TELEMETRY_ENVIRONMENT: ${ZB_TELEMETRY_ENVIRONMENT:-production}
    depends_on:
      conf-init: { condition: service_completed_successfully }
      nats-exporter: { condition: service_started }
    volumes:
      - zb-conf:/conf:ro
      - alloy-data:/var/lib/alloy/data   # the write-ahead log: a store that is down loses nothing
      # the host's journal, where every service of this stack logs (x-logging), read-only
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    restart: unless-stopped

  # ── PostgreSQL (profile "postgres") ──────────────────────────────────────────────
  postgres:
    profiles: [postgres]
    image: postgres:18.6-trixie
    logging: *logging
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_slot_wal_keep_size=2GB   # a slot left behind cannot fill the disk
    environment:
      POSTGRES_DB: zebridge
      # No ${…:?} here: compose interpolates every service, profile or not, so a required
      # variable would stop a stack that uses an external PostgreSQL. The image itself
      # refuses to start without a password.
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zebridge"]
      interval: 3s
      retries: 20
    volumes:
      - pg-data:/var/lib/postgresql
    restart: unless-stopped

  # The roles, functions and publication, from the bridge's own `--init-sql`, at every
  # start (idempotent: an upgrade brings the new functions), then the invite login. For an
  # external PostgreSQL, run it once by hand with the admin's URL (README.md).
  pg-init:
    <<: *zebridge
    profiles: [postgres]
    entrypoint: ["/bin/sh", "/usr/share/zebridge/compose/scripts/pg-init.sh"]
    environment:
      <<: *db
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-postgres://postgres:${PG_ADMIN_PASSWORD}@postgres:5432/zebridge}
      ZB_INVITER_PASSWORD: ${ZB_INVITER_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

networks:
  default:
    # IPv6 inside the stack too (Docker 27+ allocates a private range and translates it to
    # the server's address): Supabase's direct connection, the one replication needs, is
    # IPv6-only, and so are some phone networks. Harmless on a server without IPv6.
    enable_ipv6: true

volumes:
  zb-conf:          # the release's configuration, rewritten at every start
  zb-etc:           # nats-server.conf, .env.nats, creds/, operator.store, nats-data/ (JetStream)
  letsencrypt:      # certbot's account and certificates
  certs:            # the copies NATS and HAProxy read (scripts/cert-deploy.sh)
  alloy-data:       # Alloy's write-ahead log (profile "telemetry")
  pg-data:
