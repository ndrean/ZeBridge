# The browser demo: static files, plus the two routes the page uses on its own
# origin, as the Vite dev server does (vite.config.ts).
server {
    listen 5173;
    root /usr/share/nginx/html;

    # sqlite-wasm on OPFS needs a cross-origin isolated page.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker's DNS, asked at request time: nginx starts even while the bridge is
    # still coming up (a host named in proxy_pass is otherwise resolved once, at start).
    resolver 127.0.0.11 valid=10s;

    # /bridge/enroll, /bridge/renew → the bridge's HTTP surface.
    location /bridge/ {
        set $bridge bridge:27434;
        rewrite ^/bridge/(.*)$ /$1 break;
        proxy_pass http://$bridge;
    }

    # /nats → nats-server's websocket listener.
    location /nats {
        set $nats nats:8080;
        rewrite ^/nats/?(.*)$ /$1 break;
        proxy_pass http://$nats;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
