name: zebridge
description: "ZeBridge client for Dart and Flutter: an offline-first local replica of PostgreSQL tables, kept in sync over NATS, with libzb built in for Android, iOS, macOS and Linux."
version: 0.1.0
homepage: https://github.com/ndrean/zebridge
repository: https://github.com/ndrean/zebridge/tree/main/zb-dart
issue_tracker: https://github.com/ndrean/zebridge/issues
topics: [postgresql, nats, offline-first, sqlite, ffi]

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.2
  hooks: ^2.2.0
