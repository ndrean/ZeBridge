global:
  scrape_interval: 60s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "zebridge"
    metrics_path: "/metrics"
    static_configs:
      # Scrapes ZeBridge whether running in Docker container ('bridge:27434') or on host ('host.docker.internal:27434')
      - targets: ["127.0.0.1:27434", "127.0.0.1:27435",]
        labels:
          environment: "production"
          service: "cdc-bridge"

  - job_name: "nats"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["127.0.0.1:7777"]
        labels:
          environment: "production"
          service: "nats-server"

remote_write:
  - url: https://prometheus-prod-55-prod-gb-south-1.grafana.net/api/prom/push
    basic_auth:
      username: "2500869"
      # Prometheus does not expand variables in its config: the key lives in a file
      # (the key alone, mode 0600, owned by the prometheus user).
      password_file: /usr/local/etc/prometheus/grafana.key