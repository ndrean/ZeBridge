global
    log stdout format raw local0
    maxconn 60000                      # Increased to support NATS (45k) + HTTP + Headroom

defaults
    log global
    timeout connect 5s
    timeout client  50s
    timeout server  50s

# Assuming Cloudflare connects to HAProxy over standard HTTPS 
    # (Requires SSL certs on the VPS for Cloudflare "Full/Strict" mode)
    # bind *:443 ssl crt /etc/haproxy/certs/
# -------------------------------------------------------------------------
# MAIN TCP INGRESS (Listening on a single port: 8090)
# -------------------------------------------------------------------------
frontend ingress_front
    bind *:8090
    mode tcp                           # Required for TLS Pass-Through
    log-format "%ci:%cp [%t] %ft %b/%s %Tw/%Tc/%Tt %B %ts %ac/%fc/%bc/%sc/%rc %sq/%bq"

    # Wait for the client TLS Client Hello to inspect the SNI (subdomain)
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    # TCP Routing based on SNI Subdomains
    acl is_nats req_ssl_sni -i nats.my-domain.com

    # Route raw TLS straight to NATS
    use_backend bk_nats if is_nats
    
    # Everything else (HTTP/HTTPS) goes to the internal HTTP multiplexer
    default_backend bk_to_http

# -------------------------------------------------------------------------
# INTERNAL MULTIPLEXER (Forwards TCP traffic to HTTP engine)
# -------------------------------------------------------------------------
backend bk_to_http
    mode tcp
    server internal_http 127.0.0.1:8091

# -------------------------------------------------------------------------
# INTERNAL HTTP FRONTEND (Handles Rate Limiting, Bridge, and Prometheus)
# -------------------------------------------------------------------------
frontend http_bridge_front
    bind 127.0.0.1:8091 ssl crt /etc/haproxy/certs/
    mode http
    option httplog

    # Cloudflare IP Tracking for Rate Limiting
    stick-table type string len 40 size 100k expire 1m store http_req_rate(10s)
    http-request track-sc0 req.hdr(CF-Connecting-IP)

    # HTTP Subdomain Routing
    acl is_bridge hdr_beg(host) -i bridge.my-domain.com

    # Route based on subdomains
    use_backend bk_bridge if is_bridge
    default_backend bk_drop

# -------------------------------------------------------------------------
# BACKENDS
# -------------------------------------------------------------------------

# 1. NATS WSS Pass-Through
backend bk_nats
    mode tcp
    timeout tunnel 1h  # Protects long-lived WebSockets from drops
    server nats 127.0.0.1:8080 maxconn 45000 

# 2. Application Bridge
backend bk_bridge
    mode http
    balance roundrobin
    
    # Restrict allowed endpoints
    acl allowed_paths path_beg /enroll /status
    http-request deny if !allowed_paths
    
    # Rate limit /enroll endpoint (Max 3 requests per 10s per Cloudflare IP)
    acl is_enroll path_beg /enroll
    http-request deny deny_status 429 if is_enroll { sc_http_req_rate(0) gt 3 }

    server bridge 127.0.0.1:27434 maxconn 100 check


# 4. Default Drop
backend bk_drop
    mode http
    http-request return status 404