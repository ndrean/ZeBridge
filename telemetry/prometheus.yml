global:
  scrape_interval: 5s     # Scrape metrics every 5 seconds for responsive CDC dashboards
  evaluation_interval: 5s

scrape_configs:
  - job_name: "zebridge"
    metrics_path: "/metrics"
    static_configs:
      # Scrapes ZeBridge whether running in Docker container ('bridge:9090') or on host ('host.docker.internal:9090')
      - targets: ["bridge:9090", "host.docker.internal:9090"]
        labels:
          environment: "development"
          service: "cdc-bridge"

  - job_name: "nats"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["nats-exporter:7777"]
        labels:
          environment: "development"
          service: "nats-server"