global:
  scrape_interval: 5s     # Scrape metrics every 5 seconds for responsive CDC dashboards
  evaluation_interval: 5s

scrape_configs:
  - job_name: "zebridge"
    metrics_path: "/metrics"
    static_configs:
      # If Prometheus runs in Docker and ZeBridge runs on the host, 
      # replace 'localhost' with 'host.docker.internal'
      - targets: ["localhost:9090"]
        labels:
          environment: "development"
          service: "cdc-bridge"