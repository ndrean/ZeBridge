# 1. Macros (Variables)
# Change "vtnet0" if your network interface name is different (check with `ifconfig`)
ext_if = "vtnet0" 
tcp_pass = "{ 22, 8090 }"

# 2. Options
# Drop blocked packets silently to avoid giving information to port scanners
set block-policy drop
# Ignore the loopback interface completely (crucial for your 127.0.0.1 services)
set skip on lo0 

# 3. Scrubbing
# Normalizes incoming packets and drops fragmented or malformed ones
scrub in on $ext_if all fragment reassemble

# 4. Default Rules
# Block everything coming in by default
block in all
# Allow the server to initiate connections out (e.g., Prometheus remote_write, pkg updates)
pass out all keep state

# 5. Inbound Rules
# Allow SSH and HAProxy from the outside world
pass in on $ext_if proto tcp to any port $tcp_pass keep state