# -----------------------------------------------------------------------------
# MEMORY & CACHING (Targeting ~4GB Total Postgres Footprint)
# -----------------------------------------------------------------------------
shared_buffers = 2.5GB
effective_cache_size = 10.5GB          # 8GB ZFS ARC + 2.5GB shared_buffers
work_mem = 16MB                        # Per-operation memory for sorts/hashes
maintenance_work_mem = 512MB           # For vacuums, index builds

# -----------------------------------------------------------------------------
# ZFS & DISK OPTIMIZATION
# -----------------------------------------------------------------------------
random_page_cost = 1.1                 # NVMe + ZFS ARC makes random reads fast
effective_io_concurrency = 200         # Async I/O capability for NVMe

# -----------------------------------------------------------------------------
# LOGICAL REPLICATION & CDC (ZeBridge)
# -----------------------------------------------------------------------------
wal_level = logical
max_replication_slots = 6              # Covers your instances + safety margin
max_wal_senders = 10                   # Max concurrent replication/streaming processes
max_slot_wal_keep_size = 16GB           # Hard safety ceiling to protect SSD from overflow
wal_sender_timeout = 300s              # Drop dead socket connections after 5 minutes

# Memory allocation for decoding WAL into logical changes
logical_decoding_work_mem = 256MB      # Prevents logical streaming from spilling to disk

# Replication Performance
synchronous_commit = off
# -----------------------------------------------------------------------------
# WAL & COMMIT TUNING
# -----------------------------------------------------------------------------
wal_buffers = -1                       # Auto-tuned based on shared_buffers (sets ~32MB-64MB)
checkpoint_completion_target = 0.9     # Spreads checkpoint writes smoothly to prevent I/O spikes
max_wal_size = 4GB
min_wal_size = 512MB

# Commit Delay / Siblings settings:
# commit_delay = 0
# commit_siblings = 5