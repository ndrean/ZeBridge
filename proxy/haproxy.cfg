# ZeBridge edge on the VPS, behind Cloudflare.
#
# HAProxy guards ONE thing: the bridge's HTTP endpoint (/enroll, /renew, /status). The other
# paths never cross it, and they are listed here so the picture stays in one place.
#
#   client                  address                               path
#   ----------------------  ------------------------------------  -------------------------------------------------
#   mobile, native (libzb)  tls://nats.my-domain.com:4222         DNS only (grey cloud) -> nats-server, TLS on 4222
#   browser (zb-client-ts)  wss://ws.my-domain.com  (443)         Cloudflare -> Origin Rule, port 8080 -> nats-server websocket
#   anyone                  https://bridge.my-domain.com (443)    Cloudflare -> HAProxy :443 (this file) -> bridge 127.0.0.1:27434
#   Prometheus, on the VPS  remote_write, outbound HTTPS          Prometheus -> Grafana Cloud (an outbound push needs no inbound rule)
#
# Why browsers do not use 8080 at the Cloudflare edge: 8080 is on Cloudflare's plain-HTTP
# port list; a secure websocket needs one of its HTTPS ports (443, 2053, 2083, 2087, 2096,
# 8443). Browsers open wss:// on 443, and an Origin Rule sets the destination port to 8080.
#
# nats-server, in its own config:
#   port: 4222 with tls { cert_file, key_file }   a public certificate for nats.my-domain.com: phones connect
#                                                 directly, so a Cloudflare origin certificate will not do
#   websocket { port: 8080, tls { ... } }         Cloudflare "Full (strict)" speaks TLS to the origin; a Cloudflare
#                                                 origin certificate is enough on this listener
#   websocket { ping_interval: "45s" }            Cloudflare drops a websocket idle for about 100 s; the
#                                                 server keeps it warm, so no client needs configuring
#
# Prometheus scrapes the bridge on 127.0.0.1:27434/metrics and nats-server on 127.0.0.1:8222,
# then pushes to Grafana Cloud with remote_write. /metrics is never exposed here.
#
# Firewall, outside HAProxy (defence in depth): 4222 open to the world; 443 and 8080 open to
# the ranges in cloudflare-ips.lst only; 27434, 8222 and Prometheus' own port closed.
#
# The compose setup (local evaluation, hostnames faked in /etc/hosts) needs its own file.

global
    log stdout format raw local0
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s

frontend bridge_edge
    # A Cloudflare origin certificate for bridge.my-domain.com ("Full (strict)").
    bind :443 ssl crt /usr/local/etc/haproxy/certs/bridge.pem alpn h2,http/1.1

    # 1. Only Cloudflare may connect. Every rule below trusts CF-Connecting-IP, and that
    #    header is only true when the connection really comes from Cloudflare: anyone who
    #    reaches this port directly can put any address in it.
    acl from_cloudflare src -f /usr/local/etc/haproxy/cloudflare-ips.lst
    http-request deny deny_status 403 if !from_cloudflare

    # 2. The client's real address, now that the peer is known to be Cloudflare.
    http-request set-var(txn.client_ip) req.hdr(CF-Connecting-IP)
    http-request set-header X-Forwarded-For %[var(txn.client_ip)]

    # 3. Two counters per client address over 10 s: every request (sc0), and /enroll alone
    #    (sc1), so reading /status never spends the enrolment budget.
    stick-table type string len 45 size 100k expire 1m store http_req_rate(10s)
    http-request track-sc0 var(txn.client_ip)
    http-request track-sc1 var(txn.client_ip) table bk_enroll_rate if { path /enroll }

    # 4. Only the bridge's hostname.
    acl host_bridge hdr(host) -i bridge.my-domain.com bridge.my-domain.com:443
    http-request deny deny_status 404 if !host_bridge

    default_backend bk_bridge

backend bk_bridge
    # Only three paths leave the VPS, and only as GET.
    acl path_enroll path /enroll
    acl path_renew  path /renew
    acl path_status path /status
    http-request deny deny_status 404 if !path_enroll !path_renew !path_status
    http-request deny deny_status 405 if !METH_GET

    # Enrolment: 3 requests per 10 s per client address. An invite code is a secret, and
    # this bounds how fast anyone can guess one.
    http-request deny deny_status 429 if path_enroll { sc_http_req_rate(1) gt 3 }

    # Renewal: a client asks for a new JWT before its own expires. The request is signed by
    # the client's key, so there is nothing to guess; the overall budget below is enough.
    http-request deny deny_status 429 if path_renew { sc_http_req_rate(0) gt 20 }

    # Status: readable from outside, but it names tables and shows lag. 20 per 10 s.
    http-request deny deny_status 429 if path_status { sc_http_req_rate(0) gt 20 }

    server bridge 127.0.0.1:27434 maxconn 100 check

# The /enroll counter's table (a backend only holds it; nothing is routed here).
backend bk_enroll_rate
    stick-table type string len 45 size 100k expire 1m store http_req_rate(10s)
