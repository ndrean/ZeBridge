global
    log stdout format raw local0
    maxconn 50000

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend http_front
    bind *:8090
    
    # Assuming Cloudflare connects to HAProxy over standard HTTPS 
    # (Requires SSL certs on the VPS for Cloudflare "Full/Strict" mode)
    # bind *:443 ssl crt /etc/haproxy/certs/

    # -------------------------------------------------------------------------
    # Rate Limiter
    # -------------------------------------------------------------------------
    # 1. Cloudflare IP Tracking for Rate Limiting
    # type string: We extract the Cloudflare header as a string instead of a raw IP
    stick-table type string len 40 size 100k expire 1m store http_req_rate(10s)
    http-request track-sc0 req.hdr(CF-Connecting-IP)

    # -------------------------------------------------------------------------
    # Path Matchers
    # -------------------------------------------------------------------------
    # Route bridge endpoints
    # acl is_bridge path_beg /status /enroll /metrics
    # acl is_enroll path_beg /enroll
    acl is_nats    hdr_beg(host) -i nats.my-domain.com
    acl is_grafana hdr_beg(host) -i grafana.my-domain.com
    acl is_bridge  hdr_beg(host) -i bridge.my-domain.com

    use_backend bk_bridge if is_bridge
    use_backend bk_grafana if is_grafana
    use_backend bk_nats if is_nats
    default_backend bk_drop

# -------------------------------------------------------------------------
# Backends
# -------------------------------------------------------------------------
backend bk_nats
    # Cloudflare idle timeout is 100s. 
    # NATS must have `ping_interval: 45s` in its websocket{} config block.
    timeout tunnel 1h
    
    # Protect NATS from connection floods (e.g., max 5000 concurrent sockets)
    server nats nats-server:8080 maxconn 50000

backend bk_bridge
    # Only allow specific endpoints
    acl allowed_paths path_beg /enroll /status
    http-request deny if !allowed_paths
    
    # Rate limit /enroll (e.g., max 3 requests per 10 seconds per user)
    acl is_enroll path_beg /enroll
    http-request deny deny_status 429 if is_enroll { sc_http_req_rate(0) gt 3 }

    server bridge bridge:27434

backend bk_grafana
    # Grafana is heavy on rendering; cap connections to prevent CPU spikes
    server grafana grafana:3000 maxconn 2

backend bk_drop
    http-request return status 404

