# ZeBridge edge, LOCAL: the same bridge rules as haproxy.cfg, with no Cloudflare and no
# domain yet. Plain HTTP on 127.0.0.1:8090, the rate counted per connecting address.
#
#   haproxy -f proxy/haproxy.local.cfg
#   curl http://127.0.0.1:8090/status
#
# What differs from the VPS file, and why it is safe only here:
#   - no TLS: the listener is loopback only;
#   - no Cloudflare check: the client address is the TCP peer (src), which nobody can forge;
#   - no hostname check: there is no domain yet.
# Phones and browsers still talk to nats-server directly (4222, websocket 8080); this
# file only guards the bridge's /enroll and /status.

global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s

frontend bridge_local
    bind 127.0.0.1:8090

    # Two counters per client address over 10 s: every request (sc0), and /enroll alone
    # (sc1), so reading /status never spends the enrolment budget.
    stick-table type ip size 10k expire 1m store http_req_rate(10s)
    http-request track-sc0 src
    http-request track-sc1 src table bk_enroll_rate if { path /enroll }

    default_backend bk_bridge

backend bk_bridge
    acl path_enroll path /enroll
    acl path_status path /status
    http-request deny deny_status 404 if !path_enroll !path_status
    http-request deny deny_status 405 if !METH_GET
    http-request deny deny_status 429 if path_enroll { sc_http_req_rate(1) gt 3 }
    http-request deny deny_status 429 if path_status { sc_http_req_rate(0) gt 20 }
    server bridge 127.0.0.1:27434 maxconn 100 check

backend bk_enroll_rate
    stick-table type ip size 10k expire 1m store http_req_rate(10s)
