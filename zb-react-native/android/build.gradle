// libzb for React Native on Android: an Expo module over zb-android's JNI binding. It
// compiles zb-android's own Kotlin (`dev.zebridge.Native`, the C ABI one-to-one) and ships
// its libzb.so per CPU — the JNI functions are bound to that class name, so one binding
// serves both. zb-android/scripts/build.sh builds the .so files; scripts/build-android.sh
// runs it and adds the TLS roots.
//
// Expo's module plugin (SDK 53+) sets up Kotlin and expo-modules-core. The older helpers
// (ExpoModulesCorePlugin.gradle) still compile on SDK 57, but the module then crashes at
// start-up: "This function has a reified type parameter and thus can only be inlined".
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.zebridge'
version = '0.1.0'

// The published package carries zb-android's files in android/zb-android
// (scripts/prepack.sh). In this repository the package is linked into the app's
// node_modules: resolve the link before walking up, or `../..` lands in node_modules.
def vendored = new File(projectDir, "zb-android")
def zbAndroid = vendored.exists() ? vendored : new File(projectDir.canonicalFile, "../../zb-android/src/main").canonicalFile

android {
  namespace "dev.zebridge.zbnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  sourceSets {
    main {
      java.srcDirs += [new File(zbAndroid, "kotlin")]
      jniLibs.srcDirs += [new File(zbAndroid, "jniLibs")]
    }
  }
}
