# The operator-mode server of scripts/dev/compose.yml: what scripts/native/nats-server-jwt.conf
# runs, minus TLS and the leaf listener, with the operator and the account JWTs INCLUDED from
# the fragment `nsc generate config` writes (scripts/dev/state/resolver.conf) instead of pasted into this
# file. Re-running the bootstrap after a signing-key edit therefore only needs a server restart.
include "state/resolver.conf"

port: 4222
http_port: 8222

websocket {
  port: 8080
  no_tls: true
}

mqtt {
  port: 1883
}

jetstream {
  store_dir: "/data"
  max_file_store: 50GB
  domain: hub
  limits {
    # default_max_consumers needs a recent server (CLAUDE.md: 2.15 works, 2.11 does not)
    default_max_consumers: 5000
  }
}
