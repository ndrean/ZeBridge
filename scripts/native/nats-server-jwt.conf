# ── ZeBridge server shape (carried over from the pre-operator conf) ──
port: 4222
# Monitoring (/varz, /jsz, /connz): what prometheus-nats-exporter scrapes, and what the
# wasp reads. Localhost only; HAProxy never routes it.
http_port: 8222
websocket {
  port: 8080
  no_tls: true
}
jetstream {
  # Absolute, not relative: a relative path resolves against nats-server's CWD at
  # launch, which depends entirely on where up.sh itself was invoked from. Found live —
  # invoking `scripts/native/up.sh` from the repo root (the documented way) resolved
  # "../../nats-data" to a directory *outside* the repo entirely, silently reusing
  # days-old JetStream state that `down.sh --clean` (which only wipes $ROOT/nats-data)
  # could never see or remove.
  store_dir: "/Users/nevendrean/code/zig/ZeBridge/nats-data"
}
# ── leaf nodes (§10hl): a regional nats-server connects here with an account credential;
# its phones and its responder stay local, only what they cannot answer crosses.
leafnodes {
  port: 7422
}
