# ── ZeBridge server shape (carried over from the pre-operator conf) ──
port: 4222
# TLS on the client port, as in production (NOTES §10fz): the bridge dials tls://, so the
# dev measurements include it. `allow_non_tls` keeps the dev scripts and apps that still
# dial nats:// working; production leaves it out. The test certificates cover localhost
# and 127.0.0.1; paths are relative to the repository root, where the server is started.
tls {
  cert_file: "nats.zig/tests/configs/certs/server-cert.pem"
  key_file: "nats.zig/tests/configs/certs/server-key.pem"
}
allow_non_tls: true
# Monitoring (/varz, /jsz, /connz): what prometheus-nats-exporter scrapes, and what the
# wasp reads. Localhost only; HAProxy never routes it.
http_port: 8222
websocket {
  port: 8080
  no_tls: true
}
jetstream {
  # Absolute, not relative: a relative path resolves against nats-server's CWD at
  # launch, which depends entirely on where up.sh itself was invoked from. Found live —
  # invoking `scripts/native/up.sh` from the repo root (the documented way) resolved
  # "../../nats-data" to a directory *outside* the repo entirely, silently reusing
  # days-old JetStream state that `down.sh --clean` (which only wipes $ROOT/nats-data)
  # could never see or remove.
  store_dir: "/Users/nevendrean/code/zig/ZeBridge/nats-data"
  # §10is-b: the hub's JetStream domain. A leaf reaches it as `$JS.hub.API.`; clients
  # connected here directly keep working on the plain prefix (the server serves both).
  domain: hub
}
# ── leaf nodes (§10hl): a regional nats-server connects here with an account credential;
# its phones and its responder stay local, only what they cannot answer crosses.
# MQTT 3.1.1 devices (examples/09-event). In operator mode a device authenticates with a
# bearer JWT as its password (jwt-bootstrap.sh mints mqtt_globex); topic a/b/c is the NATS
# subject a.b.c, so NATS subscribers see every MQTT publish. Needs JetStream (on, above).
mqtt {
  port: 1883
}
leafnodes {
  port: 7422
  # A leaf reaching this port through a tunnel must not be told to reconnect to the
  # hub's LAN address instead (measured: the VPS leaf retried 192.168.1.11:7422).
  no_advertise: true
}
