# One origin for the browser client.
#
# Without this the client has to know two host ports that compose is free to move
# (the bridge's telemetry port and NATS's websocket port), and it hardcoded both.
# Everything the browser needs now lives behind a single port:
#
#   GET  /health  /status  /metrics   -> bridge:9090      (the bridge's own HTTP)
#   GET  /enroll?code=…&user_pubkey=… -> bridge:9090      (mints the .creds)
#   WS   /  (and /nats)               -> nats-server:8080 (JetStream over websocket)
#
# ⚠️ The websocket is served at the ROOT, not only under a prefix. Measured: the Go
# client behind the `nats` CLI DISCARDS the path in a `ws://host/nats` URL and asks
# for `/` — nginx's access log shows `GET /` for a connection opened as `/nats`. A
# prefix-only proxy therefore works from a browser (nats.ws keeps the path) and
# silently fails from every Go-based tool. Root works for both; /nats stays as an
# alias so an explicit URL is not wrong.
#
# ⚠️ This is a DEV convenience, not a security boundary. The bridge's telemetry
# endpoints are unauthenticated — putting them on one port does not make them safe
# to publish anywhere but a development machine. /enroll's protection is the
# single-use code, which is why it is the one endpoint here that is meant to be
# reachable by a browser at all.

events {}

http {
  # The websocket dance: NATS needs Upgrade/Connection passed through verbatim, and
  # `map` is what makes the Connection header correct for BOTH upgrade and plain
  # requests on the same server block.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8090;

    # NATS over websocket. Root and /nats both, see the note above.
    #
    # ⚠️ Only for an actual UPGRADE request. Proxying every root request to the
    # websocket endpoint made ordinary paths answer `400 Bad Request` from
    # nats-server — measured on `/creds/alice.creds`, which reads as "the file is
    # missing" and is nothing of the kind. `if` inside a location is only safe in
    # its `return` form, which is exactly this.
    location / {
      error_page 418 = @nats_ws;
      if ($http_upgrade) { return 418; }
      default_type text/plain;
      return 404 "zebridge edge — not a websocket request, and nothing static is served here.\n  /health /status /metrics /enroll -> the bridge\n  / and /nats WITH an Upgrade header -> nats-server\nThe page itself is served by the Vite dev server, which proxies both (web-consumer/vite.config.ts).\n";
    }

    # The websocket proper. Reached by the root when upgrading, and by /nats directly.
    #
    # ⚠️ No trailing slash on proxy_pass: nginx refuses a URI part inside a NAMED
    # location outright — `"proxy_pass" cannot have URI part in location given by
    # regular expression, or inside named location` — and the container crash-loops.
    # None is needed anyway: an upgrade lands here with the URI already `/`.
    location @nats_ws {
      proxy_pass http://nats-server:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
      # A CDC subscription is idle between writes; the default 60s would drop it.
      proxy_read_timeout  1h;
      proxy_send_timeout  1h;
    }

    # The bridge's HTTP. proxy_pass with NO uri part deliberately: nginx then passes
    # the original request line through unchanged, query string included, which
    # /enroll?code=…&user_pubkey=… depends on.
    location ~ ^/(health|status|metrics|enroll)$ {
      proxy_pass http://bridge:9090;
      proxy_set_header Host $host;
    }

    # The alias, for a client that does send the path.
    location /nats {
      proxy_pass http://nats-server:8080/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
      proxy_read_timeout  1h;
      proxy_send_timeout  1h;
    }

    # Not `/`: that is the websocket now.
    location = /edge {
      default_type text/plain;
      return 200 "zebridge edge\n  /health /status /metrics\n  /enroll?code=&user_pubkey=\n  / and /nats (websocket -> nats-server)\n";
    }
  }
}
