<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Depot</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <style>
      :root { color-scheme: light dark; font: 14px/1.45 system-ui, sans-serif; }
      body { margin: 0; display: grid; grid-template-columns: 280px 1fr; height: 100dvh; }
      aside { padding: 12px; border-right: 1px solid #8884; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
      /* The right side: the map, and under it the fleet's SQL, folded to one line until
         opened, then scrolling inside at most 40 % of the height. */
      main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
      #map { width: 100%; height: 100%; }
      #fleet { border-top: 1px solid #8884; padding: 6px 12px; }
      #fleet[open] { max-height: 40dvh; overflow-y: auto; }
      label { display: grid; gap: 3px; font-size: 12px; opacity: .8; }
      .point { padding: 6px 8px; border: 2px solid #8886; border-radius: 6px; cursor: pointer; font-size: 14px; opacity: 1; min-height: 1.4em; }
      .point.active { border-color: #1f6feb; background: #1f6feb18; }
      .point.empty { opacity: .55; font-style: italic; }
      button { padding: 7px; font: inherit; cursor: pointer; }
      #result { font-size: 16px; font-weight: 600; min-height: 1.4em; }
      #status, #detail { font-size: 12px; opacity: .75; }
      #eta { font-size: 14px; color: #1a7f37; min-height: 1.2em; }
      #notice { font-size: 13px; color: #b35900; min-height: 1.2em; }
      select { font: inherit; padding: 5px; }
      .truck span { display: block; font-size: 16px; line-height: 20px; text-align: center; border: 3px solid; border-radius: 50%; background: #fff; }
      .stoprow { display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: stretch; }
      .stoprow button { padding: 0 9px; }
      #stops { display: grid; gap: 6px; }
      .add { font-style: normal; opacity: .7; border-style: dashed; }
      .stopmark span { display: block; color: #fff; border: 2px solid #fff; border-radius: 50%; font: bold 11px/14px system-ui; text-align: center; }
      #fleet summary { cursor: pointer; font-weight: 600; }
      #fleet[open] { display: grid; gap: 6px; }
      #fleet .claim { font-size: 12px; opacity: .75; margin: 4px 0 0; }
      #sql { font: 12px/1.4 ui-monospace, Menlo, monospace; width: 100%; box-sizing: border-box; }
      .sqlbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; }
      .inline { display: inline-flex; gap: 4px; align-items: center; opacity: 1; }
      #sqlerr { color: #c0392b; font-size: 12px; white-space: pre-wrap; }
      #sqlout { overflow: auto; }
      #sqlout table { border-collapse: collapse; font-size: 12px; }
      #sqlout th, #sqlout td { border: 1px solid #8884; padding: 2px 6px; text-align: left; vertical-align: top; }
      #sqlout th { position: sticky; top: 0; background: Canvas; }
      .depot { width: 14px; height: 14px; background: #333; border: 2px solid #fff; box-sizing: border-box; }
      /* A phone: the panel a fixed 40 % of the screen, scrolling inside; the map the rest,
         whatever the panel holds (stops added used to squeeze it). svh, not dvh: the
         address bar showing or hiding does not move the split. min-height: 0 lets the
         panel scroll rather than grow past its row. */
      @media (max-width: 640px) {
        body { grid-template-columns: 1fr; grid-template-rows: 40svh minmax(0, 1fr); }
        #fleet[open] { max-height: 35svh; }
        aside { border-right: 0; border-bottom: 1px solid #8884; min-height: 0; }
      }
    </style>
  </head>
  <body>
    <aside>
      <strong>Depot routing</strong>
      <label>Truck <select id="truck"></select></label>
      <label>From <div id="from" class="point empty" tabindex="0">click here, then a charger</div></label>
      <div id="stops"></div>
      <label>To <div id="to" class="point empty" tabindex="0">click here, then a charger</div></label>
      <button id="trace" disabled>Trace route</button>
      <div id="result"></div>
      <div id="eta"></div>
      <div id="detail"></div>
      <div id="notice"></div>
      <div id="status">connecting…</div>
    </aside>
    <main>
      <div id="map"></div>
      <details id="fleet">
        <summary>What does my fleet do?</summary>
        <p class="claim">SQL on this browser's own copy of the data: no server asked, offline too. Read-only — writes go through the buttons above.</p>
        <select id="preset"></select>
        <textarea id="sql" rows="7" spellcheck="false"></textarea>
        <div class="sqlbar">
          <button id="run">Run (⌘⏎)</button>
          <label class="inline"><input type="checkbox" id="live" checked /> live</label>
          <span id="sqlinfo"></span>
        </div>
        <div id="sqlerr"></div>
        <div id="sqlout"></div>
      </details>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
