name: zebridge_flutter
description: A Flutter project for ZeBridge consumer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  zebridge:
    path: ../../../zb-dart   # the shared Dart package: libzb over FFI + the isolate worker
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
