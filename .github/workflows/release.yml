# A release, on a v* tag: the Linux and macOS downloads, the container image, and a DRAFT
# GitHub release to review and publish by hand. Run by hand (Actions → Release → Run
# workflow) it is a dry run: everything is built and kept as workflow artifacts, nothing
# is released or pushed.
#
# The registries (APT, npm, PyPI, pub.dev, Maven Central) are published separately.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: version matches the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        # One version for every package (scripts/version.py): at a tag, every one must
        # say the tag's; otherwise they must agree among themselves.
        run: |
          v=$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' build.zig.zon)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but build.zig.zon says $v"; exit 1
          fi
          python3 scripts/version.py check "$v" || { echo "::error::the packages do not all say $v: scripts/version.py set $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux tarballs and .deb
    needs: version
    # package-linux.sh builds in an arm64 Debian container: native here.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Apply the nats.zig patches
        run: for p in nats.zig-patch/[0-9][0-9]-nats.zig-*.patch; do git -C nats.zig apply "../$p"; done
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build and package
        run: |
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"
          deploy/package-linux.sh x86_64
          deploy/package-linux.sh aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/${{ needs.version.outputs.version }}/*.tar.gz
            dist/${{ needs.version.outputs.version }}/*.deb
          if-no-files-found: error

  macos:
    name: libzb for macOS
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Apply the nats.zig patches
        run: for p in nats.zig-patch/[0-9][0-9]-nats.zig-*.patch; do git -C nats.zig apply "../$p"; done
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build and package
        run: |
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"
          deploy/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/${{ needs.version.outputs.version }}/*.tar.gz
          if-no-files-found: error

  image:
    name: container image
    needs: [version, linux]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: ctx
      # docker-compose.quickstart.yml's one-time setup rides in the image: the quickstart
      # then needs no file of the repository.
      - name: Quickstart files into the context
        run: |
          mkdir -p ctx/quickstart
          cp quickstart/init.sh examples/05-tables/web-consumer/demo.sql ctx/quickstart/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          file: deploy/zebridge.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.version.outputs.version }}
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/zebridge:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/zebridge:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

  web-demo:
    name: quickstart web demo image
    needs: version
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: quickstart/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/zebridge-web-demo:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/zebridge-web-demo:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

  archiver:
    name: readings archiver image
    needs: version
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/archiver.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/zebridge-archiver:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/zebridge-archiver:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

  readings-responder:
    name: readings responder image
    needs: [version, linux]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # libzb's .deb from THIS run: the image carries the release's own libzb.
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist/${{ needs.version.outputs.version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/readings-responder.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.version.outputs.version }}
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/zebridge-readings-responder:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/zebridge-readings-responder:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

  release:
    name: draft GitHub release
    needs: [version, linux, macos, image, web-demo, archiver, readings-responder]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # By name: build-push-action adds its own build record artifact, which does not extract.
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: files
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: files
      - name: SHA256SUMS
        working-directory: files
        run: sha256sum *.tar.gz *.deb > SHA256SUMS && cat SHA256SUMS
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: files/*
      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "ZeBridge $V" \
            --notes "Container image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/zebridge:$V\` (amd64, arm64). Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\`."
