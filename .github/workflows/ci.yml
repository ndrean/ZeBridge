# Checks on every push and pull request. Nothing is published here.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge:
    name: bridge (unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Apply the nats.zig patches
        run: for p in nats.zig-patch/[0-9][0-9]-nats.zig-*.patch; do git -C nats.zig apply "../$p"; done
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # build.zig looks for libpq and zstd under /usr/lib; Ubuntu keeps them in the arch folder.
      - name: Install libpq and zstd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpq-dev libzstd-dev
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libpq.so /usr/lib/libpq.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libzstd.so /usr/lib/libzstd.so
      - run: zig build test

  libzb:
    name: libzb (unit tests, ABI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Apply the nats.zig patches
        run: for p in nats.zig-patch/[0-9][0-9]-nats.zig-*.patch; do git -C nats.zig apply "../$p"; done
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: ABI and zb.h match the code
        run: python3 libzb/python/abi_check.py
      # Zig 0.16 downloads zip sources into <cache>/tmp without creating it first.
      - name: Unit tests
        working-directory: libzb
        run: |
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"
          zig build test -Dvendor=true
      # A 32-bit target, compiled only: no 64-bit atomics there, and the release jobs
      # (Maven, React Native, pub.dev) are the only other builds that would notice.
      - name: Android armv7 compiles
        working-directory: libzb
        run: |
          ndk="$(../scripts/android-ndk.sh)"
          zig build lib -Dtarget=arm-linux-androideabi -Dcpu=cortex_a7 -Dvendor=true -Dandroid-api=29 \
            --sysroot "$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot" -Dsysroot="$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

  client-ts:
    name: zb-client-ts (typecheck, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zb-client-ts
    steps:
      - uses: actions/checkout@v5
      # The bridge hashes its grammar into every enrollment reply: the copy must be byte-identical.
      - name: grammar.json matches the bridge's
        run: cmp ../src/grammar.json src/grammar.json
      # The version comes from packageManager in the root package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: zb-client-ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test

  dart:
    name: zb-dart (analyze)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zb-dart
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
