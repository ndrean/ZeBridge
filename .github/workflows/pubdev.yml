# zb-dart to pub.dev, by OIDC (no token). Started by publish.yml when a release is
# published, on the release's tag (vX.Y.Z), like every other registry:
#
#   gh workflow run pubdev.yml --ref v0.2.0 -f publish=true
#
# pub.dev accepts a run started this way when, on the package's Admin tab, automated
# publishing allows workflow_dispatch events and the tag pattern is v{{version}}.
# Without -f publish=true (or not on a tag), it is a dry run: the libraries are built
# and `dart pub publish --dry-run` checks the package.
name: Publish to pub.dev

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish (on a vX.Y.Z tag only), when pub.dev does not have this version
        type: boolean
        default: false

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-global

jobs:
  publish:
    name: pub.dev zebridge
    runs-on: macos-15   # the iOS SDK; Zig cross-builds Android, macOS and Linux from here
    permissions:
      contents: read
      id-token: write   # setup-dart turns it into a pub.dev token
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - id: v
        name: Publish or dry run?
        env:
          ASKED: ${{ inputs.publish }}
        run: |
          v=$(sed -n 's/^version: *//p' zb-dart/pubspec.yaml)
          if [ "$ASKED" != true ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "dry run"
          elif [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::publishing needs the release's tag: ref $GITHUB_REF_NAME, pubspec $v"; exit 1
          elif curl -sf "https://pub.dev/api/packages/zebridge/versions/$v" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "zebridge $v is on pub.dev already: skipped"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "zebridge $v is new"
          fi
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: libzb for the ten targets
        run: |
          export ANDROID_NDK="$(scripts/android-ndk.sh)"   # pinned: the release machine's NDK
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"
          zb-dart/scripts/build-prebuilt.sh
      # AFTER the build: setup-dart fetches the OIDC token pub.dev accepts, and that token
      # is short-lived. Fetched before the 25-minute build, it had expired at the upload
      # ("Invalid JWT token: invalid timestamps", v0.2.0).
      - uses: dart-lang/setup-dart@v1
      - working-directory: zb-dart
        run: dart pub get
      - name: Publish
        working-directory: zb-dart
        env:
          PUBLISH: ${{ steps.v.outputs.publish }}
        run: |
          if [ "$PUBLISH" = true ]; then dart pub publish --force; else dart pub publish --dry-run; fi
