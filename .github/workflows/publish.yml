# The client packages, published by their registries' trusted publishing (OIDC): no token
# is stored here. Every package carries the release's version (scripts/version.py), so a
# published release ships all of them; each job still skips a version its registry has,
# which makes a rerun safe. pub.dev's job is its own workflow (pubdev.yml), started here on
# the release's tag: pub.dev accepts only a run on a tag matching its pattern.
# Run by hand, everything is built and checked, and nothing is published unless asked
# (gh workflow run publish.yml -f publish=true: the same rule, a version only once).
#
# Once, on each registry (owner ndrean, repository ZeBridge, workflow publish.yml):
#   npmjs.com, for @zebridge/client and @zebridge/react-native: a trusted publisher. It
#     stages (npm stage publish): each version goes live when a maintainer approves it,
#     with 2FA, on npmjs.com or with `npm stage approve <id>`
#   pypi.org, for zebridge: a trusted publisher, environment "pypi"
#   pub.dev, for zebridge (Admin tab): automated publishing from ndrean/ZeBridge, tag pattern
#     v{{version}}, workflow_dispatch events allowed
#   Maven Central, for eu.zebridge:zebridge-android: a user token from central.sonatype.com
#     (Account, Generate User Token) in the secrets MAVEN_CENTRAL_USERNAME and
#     MAVEN_CENTRAL_PASSWORD; it is signed with APT_GPG_KEY / APT_GPG_PASSPHRASE
name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the versions the registries do not have (npm stages them)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pubdev:
    name: pub.dev zebridge (pubdev.yml, on the release's tag)
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run pubdev.yml -R "$GITHUB_REPOSITORY" --ref "$TAG" -f publish=true && echo "pubdev.yml started on $TAG"

  npm-client:
    name: npm @zebridge/client
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: zb-client-ts
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14
          # npm finds its OIDC login through the .npmrc this writes (npm's own examples).
          registry-url: https://registry.npmjs.org
          package-manager-cache: false   # no cache in a release build (npm's advice)
      - name: npm with staged publishing (11.15.0 or later)
        run: npm install -g npm@^11.15.0 >/dev/null && npm --version
      - id: v
        name: Is this version new?
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@zebridge/client@$v" version 2>/dev/null | grep -q .; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "@zebridge/client $v is on npm already: skipped"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "@zebridge/client $v is new"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck && pnpm test
      # pnpm pack applies publishConfig (the dist/ entry points); npm stage publish speaks OIDC
      # and adds provenance itself.
      - run: pnpm pack
      - if: steps.v.outputs.new == 'true' && (github.event_name == 'release' || inputs.publish)
        run: npm stage publish ./zebridge-client-*.tgz
      - if: github.event_name != 'release'
        run: tar -tzf ./zebridge-client-*.tgz | head -30

  npm-react-native:
    name: npm @zebridge/react-native
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Apply the nats.zig patches
        run: for p in nats.zig-patch/[0-9][0-9]-nats.zig-*.patch; do git -C nats.zig apply "../$p"; done
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14
          registry-url: https://registry.npmjs.org
          package-manager-cache: false   # no cache in a release build; pnpm pack installs nothing
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: npm with staged publishing (11.15.0 or later)
        run: npm install -g npm@^11.15.0 >/dev/null && npm --version
      - id: v
        name: Is this version new?
        working-directory: zb-react-native
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@zebridge/react-native@$v" version 2>/dev/null | grep -q .; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "@zebridge/react-native $v is on npm already: skipped"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "@zebridge/react-native $v is new"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: libzb for iOS and Android, built here
        run: |
          export ANDROID_NDK="$(scripts/android-ndk.sh)"   # pinned: the release machine's NDK
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"
          python3 libzb/python/abi_check.py
          zb-react-native/scripts/build-ios.sh
          zb-react-native/scripts/build-android.sh
      - name: pack
        working-directory: zb-react-native
        run: pnpm pack && tar -tzf ./zebridge-react-native-*.tgz | grep -E "xcframework/Info.plist|libzb.so|zb.h" | head
      - if: steps.v.outputs.new == 'true' && (github.event_name == 'release' || inputs.publish)
        working-directory: zb-react-native
        run: npm stage publish ./zebridge-react-native-*.tgz

  pypi:
    name: PyPI zebridge
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Apply the nats.zig patches
        run: for p in nats.zig-patch/[0-9][0-9]-nats.zig-*.patch; do git -C nats.zig apply "../$p"; done
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: astral-sh/setup-uv@v6
      - id: v
        name: Is this version new?
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' zb-python/pyproject.toml)
          if curl -sf "https://pypi.org/pypi/zebridge/$v/json" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "zebridge $v is on PyPI already: skipped"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "zebridge $v is new"
          fi
      - name: The four wheels (Linux and macOS, each with its libzb)
        run: |
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"
          zb-python/scripts/build-wheels.sh
          ls -la zb-python/dist
      - if: steps.v.outputs.new == 'true' && (github.event_name == 'release' || inputs.publish)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: zb-python/dist

  maven:
    name: Maven Central eu.zebridge:zebridge-android
    runs-on: ubuntu-24.04
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-global
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Apply the nats.zig patches
        run: for p in nats.zig-patch/[0-9][0-9]-nats.zig-*.patch; do git -C nats.zig apply "../$p"; done
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.8.1
      - id: v
        name: Is this version new?
        run: |
          v=$(sed -n 's/.*coordinates("eu.zebridge", "zebridge-android", "\(.*\)").*/\1/p' zb-android/build.gradle.kts)
          if curl -sf "https://repo1.maven.org/maven2/eu/zebridge/zebridge-android/$v/zebridge-android-$v.pom" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "zebridge-android $v is on Maven Central already: skipped"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "zebridge-android $v is new"
          fi
      - name: libzb for arm64-v8a, armeabi-v7a and x86_64, then the AAR
        run: |
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"
          export ANDROID_NDK="$(scripts/android-ndk.sh)"   # pinned: the release machine's NDK
          zb-android/scripts/build.sh
      # Signed with the APT repository's key, "ZeBridge packages", the one that signs the
      # Maven files from the release machine too. Without publishing, the signed files go to
      # the runner's local repository: the signing is checked all the same.
      - name: Sign, and publish when asked
        working-directory: zb-android
        env:
          ZB_SIGNING_KEY: ${{ secrets.APT_GPG_KEY }}
          ZB_SIGNING_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PUBLISH: ${{ steps.v.outputs.new == 'true' && (github.event_name == 'release' || inputs.publish) }}
        run: |
          if [ "$PUBLISH" = true ]; then
            gradle --no-daemon publishAndReleaseToMavenCentral
          else
            gradle --no-daemon publishToMavenLocal
            ls ~/.m2/repository/eu/zebridge/zebridge-android/*/ | grep -E '\.(aar|asc)$'
          fi
