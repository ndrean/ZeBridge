<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeBridge Web Consumer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>ZeBridge CDC Web Consumer</h1>
        <div class="status-bar">
          <span id="status-badge" class="badge disconnected">DISCONNECTED</span>
          <span id="server-url">ws://localhost:8080</span>
        </div>
      </header>

      <div class="controls">
        <button id="btn-fetch-schema">Fetch Schemas</button>
        <button id="btn-request-snapshot">Request Snapshot</button>
        <button id="btn-clear-logs">Clear Logs</button>
      </div>

      <section class="auth-section">
        <div class="auth-header">
          <h4 style="margin: 0;">NATS WebSocket Connection & Auth Settings</h4>
          <button id="btn-reconnect" style="background: #2e7d32;">Connect / Reconnect</button>
        </div>
        <div class="auth-controls" style="margin-top: 0.5rem;">
          <label>
            Auth Mode:
            <select id="auth-mode">
              <option value="userpass">User / Password</option>
              <option value="nkey">NKEY Seed</option>
              <option value="jwt">JWT + NKEY Seed</option>
            </select>
          </label>

          <div id="auth-userpass-fields" class="auth-group">
            <label>User: <input type="text" id="auth-user" value="bridge_user" style="width: 120px;" /></label>
            <label>Pass: <input type="password" id="auth-pass" value="bridge_secure_password" style="width: 140px;" /></label>
          </div>

          <div id="auth-nkey-fields" class="auth-group" style="display: none;">
            <label>NKEY Seed (SU...): <input type="password" id="auth-nkey-seed" placeholder="SUAA..." style="width: 280px;" /></label>
          </div>

          <div id="auth-jwt-fields" class="auth-group" style="display: none; width: 100%;">
            <label style="width: 100%;">
              User JWT (eyJ...):
              <textarea id="auth-jwt-token" placeholder="Paste user JWT here..." rows="2" style="width: 100%; margin-top: 0.25rem; font-family: monospace; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 0.4rem;"></textarea>
            </label>
            <label style="margin-top: 0.5rem;">NKEY Seed (SU...): <input type="password" id="auth-jwt-seed" placeholder="SUAA..." style="width: 280px;" /></label>
          </div>
        </div>
      </section>

      <main>
        <h3>Live Event Logs</h3>
        <div id="log-output" class="log-container"></div>
      </main>

      <section class="mutation-section">
        <h3>Publish Client Mutation (Fan-In Test)</h3>
        <div class="mutation-controls">
          <label>
            Table:
            <select id="select-table">
              <option value="test_types">test_types</option>
              <option value="users">users</option>
            </select>
          </label>

          <label>
            Operation:
            <select id="select-op">
              <option value="INSERT">INSERT</option>
              <option value="UPDATE">UPDATE</option>
              <option value="DELETE">DELETE</option>
            </select>
          </label>
        </div>

        <div id="fields-users" class="fields-group" style="display: none;">
          <label>ID: <input type="number" id="user-id" value="1" style="width: 80px;" /></label>
          <label>Name: <input type="text" id="user-name" value="Alice Smith" /></label>
          <label>Email: <input type="email" id="user-email" value="alice@example.com" /></label>
        </div>

        <div id="fields-test_types" class="fields-group">
          <label>ID: <input type="number" id="tt-id" value="12" style="width: 80px;" /></label>
          <label>UID: <input type="text" id="tt-uid" value="f4b0611f-7258-47f8-bceb-0eba9ac5195a" style="width: 270px;" /></label>
          <label>Age: <input type="number" id="tt-age" value="30" style="width: 80px;" /></label>
          <label>Temperature: <input type="number" step="0.1" id="tt-temp" value="36.6" style="width: 90px;" /></label>
          <label>Price: <input type="text" id="tt-price" value="123.4500" style="width: 110px;" /></label>
          <label><input type="checkbox" id="tt-is_true" checked /> is_true</label>
          <label>Some Text: <input type="text" id="tt-text" value="Sample text" /></label>
          <label>Tags (JSON): <input type="text" id="tt-tags" value='["tag1", "tag2"]' style="width: 180px;" /></label>
          <label>Matrix (JSON): <input type="text" id="tt-matrix" value='[[1, 2], [3, 4]]' style="width: 180px;" /></label>
          <label class="full-width">
            Metadata (JSON):
            <textarea id="tt-metadata" rows="3" style="width: 100%; margin-top: 0.25rem; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; font-family: monospace; padding: 0.5rem;">{"key_1": "value_1", "key_2": [[1, 2], [3, 4], [5, 6]], "key_3": {"key_4": "value_4", "key_5": "value_5"}}</textarea>
          </label>
        </div>

        <button id="btn-publish-mutation">Publish Mutation</button>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
